      // flou du crayon : 6 px de profondeur de champ + d (recul quand la lampe baisse) + 1,5 × le flou de bougé
      function pencilSeg(fromBlur, toBlur, fromO, toO, dur, ease, pos) {
        ft(pencilIn, { filter: "blur(" + fromBlur + "px)", opacity: fromO }, { filter: "blur(" + toBlur + "px)", opacity: toO, duration: dur, ease: ease }, pos);
      }

      // pages qui se retournent : l'axe est le bord haut (incliné de -2deg comme la page)
      gsap.set($("flipA"), { rotation: -2, rotationX: 0, transformPerspective: 1700, transformOrigin: "540px 230px" });
      gsap.set($("flipA-in"), { rotation: 2, transformOrigin: "540px 230px" });
      gsap.set($("flipB"), { rotation: -2, rotationX: 0, transformPerspective: 1700, transformOrigin: "540px 230px" });
      gsap.set($("flipB-in"), { rotation: 2, transformOrigin: "540px 230px" });

      /* ---- piste caméra ---- */
      // 0.00 → 0.20 atterrissage du whip vers le bas : y +200 → 0, flou 8 → 0 (même fenêtre, power3.out)
      camSeg({ y: 200, s: 1.0, b: 8 }, { y: 0, s: 1.0, b: 0 }, 0.20, "power3.out", 0);
      pencilSeg(18, 6, 0.92, 0.92, 0.20, "power3.out", 0);
      // 0.20 → 2.40 dérive lente qui ne s'arrête pas : 1.00 → 1.08
      camSeg({ s: 1.0 }, { s: 1.08 }, 2.20, "none", 0.20);
      // secousse légère à chaque page tournée (x seulement, 3 pas)
      function shake(pos, a) {
        camSeg({ x: 0 }, { x: a }, 0.04, "power2.out", pos);
        camSeg({ x: a }, { x: -a * 0.7 }, 0.05, "power2.inOut", pos + 0.04);
        camSeg({ x: -a * 0.7 }, { x: 0 }, 0.07, "power2.out", pos + 0.09);
      }
      shake(2.22, 6);
      shake(2.42, 4);
      // 2.40 → 4.60 dérive : 1.08 → 1.12
      camSeg({ s: 1.08 }, { s: 1.12 }, 2.20, "none", 2.40);
      // 3.00 profondeur de champ : quand la lampe baisse, le premier plan recule (flou +4 px, atténué)
      pencilSeg(6, 10, 0.92, 0.7, 0.6, "power2.inOut", 3.00);
      // 4.60 → 4.80 poussée vers le post-it (power3.in, en cours à la couture) : échelle 1.25, flou 0 → 8 px
      camSeg({ x: 0, y: 0, s: 1.12, b: 0 }, { x: -60, y: 40, s: 1.25, b: 8 }, 0.20, "power3.in", 4.60);
      pencilSeg(10, 22, 0.7, 0.7, 0.20, "power3.in", 4.60);

      /* ---- scène 1 : la promesse du lundi ---- */
      // 0.45 le post-it « Commencer » arrive depuis la caméra : trop grand, flou, tourné ; il se pose en (470, 700) à 5deg
      ft($("postitA"), { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 0.45);
      ft($("postitA"), { scale: 1.8, rotation: 12, x: 40, y: 90, transformOrigin: "50% 50%" },
        { scale: 1, rotation: 5, x: 0, y: 0, duration: 0.30, ease: "expo.out" }, 0.45);
      ft($("postitA"), { filter: "blur(14px)" }, { filter: "blur(0px)", duration: 0.30, ease: "expo.out" }, 0.45);
      // son ombre : lointaine et molle tant qu'il vole, elle se resserre sous lui à 0.90 (il colle)
      ft($("pshadowA"), { opacity: 0, scale: 1.3, rotation: 9, x: 120, y: 190, filter: "blur(46px)" },
        { opacity: 0.42, scale: 1.06, rotation: 5, x: 34, y: 64, filter: "blur(26px)", duration: 0.30, ease: "expo.out" }, 0.45);
      ft($("pshadowA"), { opacity: 0.42, scale: 1.06, x: 34, y: 64, filter: "blur(26px)" },
        { opacity: 0.30, scale: 1.0, x: 6, y: 16, filter: "blur(10px)", duration: 0.30, ease: "power3.out" }, 0.90);
      // 1.18 le crayon roule de 20 px (perpendiculaire à son axe), ses facettes tournent
      ft(pencilIn, { y: 0 }, { y: 20, duration: 0.50, ease: "power3.out" }, 1.18);
      ft($("facets"), { y: 0 }, { y: -12, duration: 0.50, ease: "power3.out" }, 1.18);
      // 1.90 la case du post-it pulse une fois
      ft($("checkA"), { scale: 1 }, { scale: 1.15, duration: 0.12, ease: "power3.out" }, 1.90);
      ft($("checkA"), { scale: 1.15 }, { scale: 1, duration: 0.18, ease: "power2.inOut" }, 2.02);

      // 2.19 « Mercredi » existe sous « Lundi » ; 2.20 « Lundi » se retourne vite vers le haut (0 → -100deg, 0.25 s power3.in)
      ft($("flipB"), { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, 2.19);
      ft($("flipA"), { rotationX: 0 }, { rotationX: -100, duration: 0.25, ease: "power3.in" }, 2.20);
      ft($("flipA-in"), { filter: "brightness(1)" }, { filter: "brightness(0.6)", duration: 0.25, ease: "power2.in" }, 2.20);
      ft($("flipA"), { opacity: 1 }, { opacity: 0, duration: 0.001, ease: "none" }, 2.45);
      // 2.39 « Dimanche » existe sous « Mercredi » ; 2.40 « Mercredi » se retourne aussi (0.15 s)
      ft($("sun"), { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, 2.39);
      ft($("flipB"), { rotationX: 0 }, { rotationX: -100, duration: 0.15, ease: "power3.in" }, 2.40);
      ft($("flipB-in"), { filter: "brightness(1)" }, { filter: "brightness(0.6)", duration: 0.15, ease: "power2.in" }, 2.40);
      ft($("flipB"), { opacity: 1 }, { opacity: 0, duration: 0.001, ease: "none" }, 2.56);
      // le post-it a survécu : sur « Dimanche » en (470, 600), il frémit dans l'air de la page tournée et se recolle
      ft($("postitC"), { rotation: 1, y: -10, transformOrigin: "50% 0%" }, { rotation: 4, y: 0, duration: 0.30, ease: "power3.out" }, 2.50);

      /* ---- scène 2 : dimanche, rien ---- */
      // 3.00 la lampe baisse : halo froid 100 → 70 % (0.5 s) ; l'heure « 23:12 » apparaît dans l'en-tête
      ft($("lamp"), { opacity: 1 }, { opacity: 0.7, duration: 0.5, ease: "power2.inOut" }, 3.00);
      ft($("clock"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 3.00);
      // 4.20 une poussière traverse la page vide, puis s'éteint hors de la lumière avant la couture
      ft($("dust"), { opacity: 0 }, { opacity: 0.85, duration: 0.15, ease: "power2.out" }, 4.20);
      ft($("dust"), { x: 0 }, { x: 360, duration: 0.50, ease: "none" }, 4.20);
      ft($("dust"), { y: 0 }, { y: -50, duration: 0.50, ease: "sine.inOut" }, 4.20);
      ft($("dust"), { opacity: 0.85 }, { opacity: 0, duration: 0.12, ease: "power2.in" }, 4.58);

      /* ---- la phrase de la voix : mot par mot, chaque mot 1 image avant son repère ---- */
      Array.prototype.forEach.call(document.querySelectorAll("#f02-subs .pm-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - 1 / 30;
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, cue);
      });
      // 1.53 la boîte rouge se trace sous « commencer. » (de la gauche, 0.16 s)
      ft($("box1"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 1.53);
      // 2.15 la première phrase s'en va (flou 6, 0.12 s)
      ft($("sub1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.12, ease: "power2.in" }, 2.15);
      // 3.75 la boîte rouge se trace sous « rien »
      ft($("box2"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 3.75);
      // 4.55 la seconde phrase s'en va
      ft($("sub2"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.12, ease: "power2.in" }, 4.55);

      // longueur exacte du plan
      tl.set({}, {}, DUR);
      // première image = handoff_in, avant tout seek
      tl.seek(0);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
