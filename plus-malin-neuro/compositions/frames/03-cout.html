  <script src="assets/js/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "03-cout", DUR = 2.06;
      function $(id) { return document.getElementById("f03-" + id); }
      var camEl = $("cam"), dimEl = $("dim"), cntEl = $("cnt"), wrapEl = $("num-wrap"), numEl = $("num");

      var tl = gsap.timeline({ paused: true });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      /* ---- la caméra : tweens directs (aucun callback) ----
         x : panoramique, s : échelle, b : flou de bougé (px) ; la page garde son flou propre de 6 px en plus. */
      gsap.set(camEl, { transformOrigin: "540px 860px" });
      function camSeg(from, to, dur, ease, pos) {
        var cf = {}, ct = {};
        if ("x" in from) { cf.x = from.x; ct.x = to.x; }
        if ("s" in from) { cf.scale = from.s; ct.scale = to.s; }
        ct.duration = dur; ct.ease = ease;
        ft(camEl, cf, ct, pos);
        if ("b" in from) {
          ft(dimEl, { filter: "blur(" + (6 + from.b) + "px)" }, { filter: "blur(" + (6 + to.b) + "px)", duration: dur, ease: ease }, pos);
          ft(cntEl, { filter: "blur(" + from.b + "px)" }, { filter: "blur(" + to.b + "px)", duration: dur, ease: ease }, pos);
        }
      }

      /* ---- piste caméra ---- */
      // 0.00 → 0.20 atterrissage du push in : échelle 0.94 → 1.00, flou 8 → 0 (power3.out)
      camSeg({ x: 0, s: 0.94, b: 8 }, { x: 0, s: 1.00, b: 0 }, 0.20, "power3.out", 0);
      // 0.20 → 1.90 dérive qui ne s'arrête pas : 1.00 → 1.04
      camSeg({ s: 1.00 }, { s: 1.04 }, 1.70, "none", 0.20);
      // 1.90 → 2.06 whip à droite (power3.in) : x 0 → -320, flou 0 → 8 px (en cours à la couture)
      camSeg({ x: 0, b: 0 }, { x: -320, b: 8 }, 0.16, "power3.in", 1.90);

      /* ---- 0.10 le compteur arrive depuis la caméra sur « 1 » : échelle 2 → 1, flou 12 → 0 (0.25 s) ---- */
      ft(wrapEl, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 0.10);
      ft(wrapEl, { scale: 2, filter: "blur(12px)" }, { scale: 1, filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, 0.10);
      // 0.30 l'étiquette « semaines perdues »
      ft($("label"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.30, ease: "power3.out" }, 0.30);

      /* ---- 0.40 → 1.60 le nombre roule 1 → 52 : un tl.set par entier (pas dur), cadence power2.in ;
         chaque entier n tombe quand la courbe power2.in (1 + 51 p²) l'atteint ---- */
      var T0 = 0.40, TD = 1.20, A = 1, B = 52;
      for (var n = A + 1; n <= B; n++) {
        var p = Math.sqrt((n - A) / (B - A));
        tl.set(numEl, { textContent: String(n) }, T0 + TD * p);
      }
      // il grandit avec la valeur : échelle 1 → 1.12, même fenêtre, même ease
      ft(numEl, { scale: 1 }, { scale: 1.12, duration: TD, ease: "power2.in" }, T0);
      // 1.60 « 52 » se pose avec une petite secousse (x ±6, 0.12 s)
      ft(wrapEl, { x: 0 }, { x: 6, duration: 0.03, ease: "power2.out" }, 1.60);
      ft(wrapEl, { x: 6 }, { x: -6, duration: 0.03, ease: "power2.inOut" }, 1.63);
      ft(wrapEl, { x: -6 }, { x: 3, duration: 0.03, ease: "power2.inOut" }, 1.66);
      ft(wrapEl, { x: 3 }, { x: 0, duration: 0.03, ease: "power2.out" }, 1.69);

      /* ---- la phrase de la voix : mot par mot, chaque mot 1 image avant son repère ---- */
      Array.prototype.forEach.call(document.querySelectorAll("#f03-subs .pm-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - 1 / 30;
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, cue);
      });
      // 1.25 la boîte rouge se trace sous « perdue. » (de la gauche, 0.16 s)
      ft($("box"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 1.25);
      // 1.85 le sous-titre s'en va
      ft($("sub1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.12, ease: "power2.in" }, 1.85);

      // longueur exacte du plan
      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
