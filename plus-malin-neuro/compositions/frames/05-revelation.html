    (function () {
      var FID = "05-revelation", DUR = 3.81, F = 1 / 30;

      var camEl = $("cam");

      /* ---- les bords déchirés : une seule ligne en dents de scie, partagée par les deux moitiés (clip-paths statiques) ---- */
      var JAG = [0, 14, -10, 6, -16, 9, -4, 17, -12, 3, -8, 15, -14, 7, -2, 12, -17, 5, -9, 16, -6, 10, -13, 2, -11, 18, -5, 8, -15, 11, -3, 13, 0];
      function edge(base) { return JAG.map(function (d, i) { return (base + d) + "px " + (i * 60) + "px"; }); }
      $("faceL").style.clipPath = "polygon(0px 0px, " + edge(1240).join(", ") + ", 0px 1920px)";
      $("faceR").style.clipPath = "polygon(" + edge(40).join(", ") + ", 1280px 1920px, 1280px 0px)";
      // le liseré de papier est en retrait de 3 px sous la face noire : invisible tant que le noir est entier
      $("rimL").style.clipPath = "polygon(0px 0px, " + edge(1237).join(", ") + ", 0px 1920px)";
      $("rimR").style.clipPath = "polygon(" + edge(43).join(", ") + ", 1280px 1920px, 1280px 0px)";

      var tl = gsap.timeline({ paused: true });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      /* ---- piste caméra (#f05-cam) : 0.70 → 1.20 poussée à travers la déchirure (1.15 → 1.00), puis dérive 1.00 → 1.02 ---- */
      ft(camEl, { scale: 1.15 }, { scale: 1.15, duration: 0.70, ease: "none" }, 0); // tenue avant la déchirure
      ft(camEl, { scale: 1.15 }, { scale: 1.0, duration: 0.50, ease: "power3.out" }, 0.70);
      ft(camEl, { scale: 1.0 }, { scale: 1.02, duration: DUR - 1.20, ease: "none" }, 1.20);

      /* ---- 0.00 les yeux rouges s'éteignent (0.2 s) ---- */
      ft([$("eye1"), $("eye2")], { opacity: 1 }, { opacity: 0, duration: 0.20, ease: "power2.in" }, 0);

      /* ---- 0.30 la fêlure d'or se trace en x 540, y 300 → 1300 ---- */
      ft($("crack"), { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none" }, 0.30);
      ft($("crack"), { scaleY: 0 }, { scaleY: 1, duration: 0.30, ease: "power2.out" }, 0.30);
      ft($("crackhalo"), { opacity: 0, scaleY: 0, scaleX: 0.6 }, { opacity: 0.7, scaleY: 1, scaleX: 1, duration: 0.26, ease: "power2.out" }, 0.30);
      ft($("crackhalo"), { opacity: 0.7, scaleX: 1 }, { opacity: 1, scaleX: 1.5, duration: 0.14, ease: "power2.in" }, 0.56);

      /* ---- 0.70 le noir se déchire : les deux moitiés s'écartent (x ∓520, 0.5 s power3.out), la fibre de papier apparaît ---- */
      gsap.set($("halfL"), { transformOrigin: "1240px 960px" });
      gsap.set($("halfR"), { transformOrigin: "40px 960px" });
      ft($("halfL"), { x: 0, rotation: 0 }, { x: -520, rotation: -7, duration: 0.50, ease: "power3.out" }, 0.70);
      ft($("halfR"), { x: 0, rotation: 0 }, { x: 520, rotation: 7, duration: 0.50, ease: "power3.out" }, 0.70);
      ft($("faceL"), { x: 0 }, { x: -19, duration: 0.25, ease: "power3.out" }, 0.70);
      ft($("faceR"), { x: 0 }, { x: 19, duration: 0.25, ease: "power3.out" }, 0.70);
      // la fêlure s'élargit et s'éteint dans la lumière
      ft($("crack"), { scaleX: 1, opacity: 1 }, { scaleX: 4, opacity: 0, duration: 0.25, ease: "power2.out" }, 0.70);
      ft($("crackhalo"), { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.out" }, 0.70);
      // 0.75 la lumière dorée inonde depuis le centre
      ft($("halo"), { opacity: 0, scale: 0.15 }, { opacity: 1, scale: 1, duration: 0.40, ease: "power3.out" }, 0.75);
      ft($("flood"), { opacity: 0, scaleX: 0.08, scaleY: 0.9 }, { opacity: 1, scaleX: 1.1, scaleY: 1.05, duration: 0.35, ease: "power3.out" }, 0.75);
      ft($("flood"), { opacity: 1 }, { opacity: 0.35, duration: 0.90, ease: "power2.out" }, 1.10);
      ft($("flood"), { opacity: 0.35 }, { opacity: 0, duration: 0.60, ease: "power2.inOut" }, 2.80);

      /* ---- 0.90 la couverture sort de la déchirure : trop grande, floue → nette en (260, 360), -3deg (mise au point) ---- */
      ft($("cover"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 0.90);
      ft($("cover"), { scale: 1.4, y: 140, rotation: -3, filter: "blur(12px)", transformOrigin: "50% 50%" },
        { scale: 1, y: 0, rotation: -3, filter: "blur(0px)", duration: 0.50, ease: "expo.out" }, 0.90);

      /* ---- 2.30 les moitiés quittent le cadre ---- */
      ft($("halfL"), { x: -520, rotation: -7 }, { x: -800, rotation: -9, duration: 0.40, ease: "power3.in" }, 2.30);
      ft($("halfR"), { x: 520, rotation: 7 }, { x: 800, rotation: 9, duration: 0.40, ease: "power3.in" }, 2.30);

      /* ---- 2.80 un reflet doré balaie la couverture ---- */
      ft($("sheen"), { x: 0, rotation: 20 }, { x: 1150, rotation: 20, duration: 0.45, ease: "power2.inOut" }, 2.80);

      /* ---- les phrases de la voix : mot par mot, chaque mot 1 image avant son repère ---- */
      Array.prototype.forEach.call(document.querySelectorAll("#f05-subs .pm-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - F;
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, cue);
      });
      // 1.17 la boîte verte se trace sous « démasque »
      ft($("box"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 1.17);
      // 1.90 changement de phrase
      ft($("subA"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 1.90);
