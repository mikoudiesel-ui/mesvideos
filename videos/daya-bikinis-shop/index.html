      // iris wipe: a disc grows from a point to cover the frame just before the cut, then

      const cuts = [4.2, 10.4, 16.4, 22, 32];
      const from = [
        [900, 1500],
        [180, 380],
        [920, 300],
        [160, 1400],
        [540, 1700],

      cuts.forEach((c, i) => {
        const el = "#w" + (i + 1);
