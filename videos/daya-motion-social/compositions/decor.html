<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="decor-template">
      <link rel="stylesheet" href="assets/css/daya.css" />
      <style>
        @font-face {
          font-family: "Daya Serif";
          src: url("assets/fonts/DejaVuSerif-Bold.ttf") format("truetype");
          font-weight: 700;
        }
        @font-face {
          font-family: "Daya Sans";
          src: url("assets/fonts/DejaVuSans.ttf") format("truetype");
          font-weight: 400;
        }
        @font-face {
          font-family: "Daya Sans";
          src: url("assets/fonts/DejaVuSans-Bold.ttf") format("truetype");
          font-weight: 700;
        }
        #decor-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #181421;
        }
        #decor-base {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(ellipse 80% 45% at 50% 52%, #2c1a18 0%, #1d1520 60%, #181421 100%);
        }
        #decor-shop,
        #decor-palms {
          position: absolute;
          inset: -40px;
        }
        #decor-shop .wall {
          position: absolute;
          left: 0;
          right: 0;
          top: 380px;
          height: 1020px;
          background: linear-gradient(180deg, #24140f 0%, #3a1e12 55%, #2b160f 100%);
        }
        .decor-arch {
          position: absolute;
          border-radius: 999px 999px 0 0;
          overflow: hidden;
          background: radial-gradient(ellipse 75% 55% at 50% 22%, #ffd598 0%, #f6a04c 24%, #cf6826 50%, #7a3514 78%, #3a1a0d 100%);
          box-shadow: 0 0 90px 24px rgba(255, 140, 60, 0.32);
        }
        .decor-arch .niche {
          position: absolute;
          left: 14%;
          right: 14%;
          top: 16%;
          bottom: 0;
          border-radius: 999px 999px 0 0;
          background: radial-gradient(ellipse 80% 60% at 50% 15%, #ffcf86 0%, #e2853a 35%, #8d4019 75%, #4a210f 100%);
          opacity: 0.85;
        }
        .decor-arch .lamp {
          position: absolute;
          left: 50%;
          top: 9%;
          width: 60px;
          height: 60px;
          margin-left: -30px;
          border-radius: 50%;
          background: radial-gradient(circle, #fff3d6 0%, rgba(255, 220, 150, 0.6) 35%, rgba(255, 180, 90, 0) 70%);
        }
        .decor-arch .product {
          position: absolute;
          left: 10%;
          width: 80%;
          bottom: 4%;
          height: 74%;
          object-fit: cover;
          object-position: 50% 20%;
          border-radius: 999px 999px 0 0;
          opacity: 0.8;
        }
        .decor-arch .shelf {
          position: absolute;
          left: 6%;
          right: 6%;
          bottom: 0;
          height: 9%;
          background: linear-gradient(180deg, #5a2a12 0%, #2a130b 100%);
        }
        #decor-arch-l2 { left: -150px; top: 600px; width: 380px; height: 820px; }
        #decor-arch-l1 { left: 250px; top: 760px; width: 200px; height: 470px; opacity: 0.7; }
        #decor-arch-r1 { left: 670px; top: 760px; width: 200px; height: 470px; opacity: 0.7; }
        #decor-arch-r2 { left: 830px; top: 600px; width: 380px; height: 820px; }
        #decor-shop .floor {
          position: absolute;
          left: 0;
          right: 0;
          top: 1380px;
          bottom: 0;
          background:
            radial-gradient(ellipse 30% 40% at 6% 4%, rgba(255, 150, 70, 0.35) 0%, rgba(255, 150, 70, 0) 100%),
            radial-gradient(ellipse 30% 40% at 96% 4%, rgba(255, 150, 70, 0.35) 0%, rgba(255, 150, 70, 0) 100%),
            radial-gradient(ellipse 60% 30% at 50% 0%, rgba(255, 120, 60, 0.22) 0%, rgba(255, 120, 60, 0) 100%),
            linear-gradient(180deg, #2a160f 0%, #150d10 55%, #100b10 100%);
        }
        #decor-palms svg {
          position: absolute;
          overflow: visible;
        }
        #decor-palms .frond-shape {
          fill: #1a2a1b;
          stroke: #3b4b2a;
          stroke-width: 2;
        }
        #decor-vignette {
          position: absolute;
          inset: 0;
          background:
            linear-gradient(180deg, rgba(16, 12, 20, 0.94) 0%, rgba(16, 12, 20, 0.72) 13%, rgba(16, 12, 20, 0) 24%),
            radial-gradient(ellipse 85% 70% at 50% 55%, rgba(16, 12, 20, 0) 55%, rgba(12, 9, 15, 0.8) 100%);
        }
      </style>

      <div id="decor-root" data-layout-allow-overflow data-composition-id="decor" data-width="1080" data-height="1920" data-duration="26.466666666666665">
        <div id="decor-base"></div>
        <div id="decor-shop">
          <div class="wall"></div>
          <div class="decor-arch" id="decor-arch-l1"><div class="niche"></div><div class="lamp"></div><div class="shelf"></div></div>
          <div class="decor-arch" id="decor-arch-r1"><div class="niche"></div><div class="lamp"></div><div class="shelf"></div></div>
          <div class="decor-arch" id="decor-arch-l2">
            <div class="niche"></div>
            <div class="lamp"></div>
            <img class="product" id="decor-rose" src="assets/img/rose-photo.jpg" alt="Bikini rose (illustration)" />
            <div class="shelf"></div>
          </div>
          <div class="decor-arch" id="decor-arch-r2">
            <div class="niche"></div>
            <div class="lamp"></div>
            <img class="product" id="decor-vert" src="assets/img/vert-photo.jpg" alt="Bikini vert (illustration)" />
            <div class="shelf"></div>
          </div>
          <div class="floor"></div>
        </div>
        <div id="decor-palms">
          <svg id="decor-palm-tl" width="520" height="520" viewBox="0 0 520 520" style="left: -40px; top: 120px">
            <defs>
              <g id="decor-frond">
                <path class="frond-shape" d="M0 0 C 60 -18, 140 -20, 230 6 C 150 4, 70 10, 0 0 Z" />
                <path class="frond-shape" d="M40 -4 C 60 -60, 90 -90, 120 -110 C 100 -70, 80 -40, 52 -2 Z" />
                <path class="frond-shape" d="M80 -8 C 110 -70, 150 -100, 190 -116 C 160 -76, 130 -40, 94 -6 Z" />
                <path class="frond-shape" d="M120 -8 C 160 -60, 200 -80, 240 -86 C 200 -54, 170 -28, 134 -4 Z" />
                <path class="frond-shape" d="M40 4 C 70 60, 100 90, 130 106 C 110 70, 90 40, 54 2 Z" />
                <path class="frond-shape" d="M84 8 C 120 66, 160 96, 196 106 C 166 72, 136 40, 98 6 Z" />
                <path class="frond-shape" d="M126 10 C 166 56, 204 74, 244 78 C 206 50, 176 26, 140 6 Z" />
              </g>
            </defs>
            <use href="#decor-frond" transform="translate(20 300) rotate(-38) scale(1.5)" />
            <use href="#decor-frond" transform="translate(10 360) rotate(-8) scale(1.7)" />
            <use href="#decor-frond" transform="translate(30 420) rotate(22) scale(1.4)" />
          </svg>
          <svg id="decor-palm-tr" width="520" height="520" viewBox="0 0 520 520" style="left: 640px; top: 160px">
            <use href="#decor-frond" transform="translate(500 300) scale(-1.5 1.5) rotate(-36)" />
            <use href="#decor-frond" transform="translate(510 370) scale(-1.6 1.6) rotate(-6)" />
            <use href="#decor-frond" transform="translate(500 430) scale(-1.4 1.4) rotate(24)" />
          </svg>
          <svg id="decor-palm-bl" width="560" height="560" viewBox="0 0 560 560" style="left: -60px; top: 1440px">
            <use href="#decor-frond" transform="translate(10 400) rotate(-50) scale(1.8)" />
            <use href="#decor-frond" transform="translate(0 470) rotate(-20) scale(2)" />
          </svg>
          <svg id="decor-palm-br" width="560" height="560" viewBox="0 0 560 560" style="left: 600px; top: 1420px">
            <use href="#decor-frond" transform="translate(560 420) scale(-1.8 1.8) rotate(-48)" />
            <use href="#decor-frond" transform="translate(570 490) scale(-2 2) rotate(-18)" />
          </svg>
        </div>
        <div id="decor-vignette"></div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const END = 794 / 30;
          // Éclairage de la boutique par scène : [temps global, lumière, flou px, opacité palmiers]
          // Fin (S14) = état de l'image 0 pour que la boucle raccorde.
          const K = [
            [0.0, 0.35, 6, 0.55],
            [0.4, 1.0, 3, 0.7],
            [1.47, 1.0, 3, 0.7],
            [1.8, 0.16, 14, 0.25], // S02–S03 : interface sur fond sombre
            [5.0, 0.16, 14, 0.25],
            [5.6, 0.78, 6, 0.6], // S04 : fond assombri
            [7.8, 0.85, 11, 0.6], // S05 : boutique floue derrière la messagerie
            [9.6, 1.0, 4, 0.7], // S06
            [11.8, 0.92, 5, 0.65], // S07
            [13.9, 0.9, 6, 0.6], // S08
            [17.8, 0.62, 9, 0.5], // S09 : le showroom porte sa propre lumière
            [19.0, 0.7, 9, 0.5], // S10
            [20.7, 0.82, 8, 0.6], // S11
            [21.9, 0.82, 13, 0.6], // S12 : bokeh
            [23.0, 1.0, 3, 0.7], // S13 : signature, comme S01
            [25.5, 1.0, 3, 0.7],
            [25.9, 0.45, 7, 0.95], // S14 : nuit, palmiers
            [END - 1 / 30, 0.35, 6, 0.55],
          ];
          const shop = "#decor-shop";
          const palms = "#decor-palms";
          for (let i = 0; i < K.length - 1; i++) {
            const [t0, l0, b0, p0] = K[i];
            const [t1, l1, b1, p1] = K[i + 1];
            const first = i === 0;
            tl.fromTo(
              shop,
              { opacity: l0, filter: `blur(${b0}px)` },
              { opacity: l1, filter: `blur(${b1}px)`, duration: t1 - t0, ease: "sine.inOut", immediateRender: first },
              t0,
            );
            tl.fromTo(
              palms,
              { opacity: p0 },
              { opacity: p1, duration: t1 - t0, ease: "sine.inOut", immediateRender: first },
              t0,
            );
          }
          // Dérive lente de caméra sur tout le film (retour exact à la position de départ pour la boucle)
          tl.fromTo(shop, { x: -14, scale: 1.035 }, { x: 14, scale: 1.0, duration: END * 0.5, ease: "sine.inOut" }, 0);
          tl.fromTo(shop, { x: 14, scale: 1.0 }, { x: -14, scale: 1.035, duration: END * 0.5 - 1 / 30, ease: "sine.inOut", immediateRender: false }, END * 0.5);
          // Palmiers : léger balancement, nombre fini de cycles
          ["#decor-palm-tl", "#decor-palm-tr", "#decor-palm-bl", "#decor-palm-br"].forEach((sel, i) => {
            const cycle = 3.3 + i * 0.4;
            const reps = Math.max(0, Math.floor(END / cycle) - 1);
            tl.fromTo(
              sel,
              { rotation: -1.6, transformOrigin: i % 2 ? "100% 60%" : "0% 60%" },
              { rotation: 1.6, duration: cycle / 2, ease: "sine.inOut", yoyo: true, repeat: reps * 2 + 1 },
              0,
            );
          });
          window.__timelines["decor"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
