        #s10-sparks circle {

            <div id="s10-screen">

              <div class="statusbar">
                <span class="time">9:41</span>
                <span class="icons"><span class="bars"><i style="height: 8px"></i><i style="height: 12px"></i><i style="height: 16px"></i><i style="height: 20px"></i></span><span class="batt"><i></i></span></span>

            <path d="M175 1238 L175 1296 A115 26 0 0 0 405 1296 L405 1238 Z" fill="url(#s10-g-body)" />
            <ellipse cx="290" cy="1238" rx="115" ry="26" fill="#2a1d1a" stroke="#ff4269" stroke-width="3" style="filter: drop-shadow(0 0 8px rgba(255, 66, 105, 0.8))" />
            <path d="M655 1238 L655 1296 A115 26 0 0 0 885 1296 L885 1238 Z" fill="url(#s10-g-body)" />

            <ellipse cx="530" cy="1268" rx="230" ry="46" fill="#2a1d1a" stroke="#ff4269" stroke-width="4" style="filter: drop-shadow(0 0 10px rgba(255, 66, 105, 0.9))" />

        <h1 class="scene-title" id="s10-title" style="font-size: 80px">

          <span class="ln coral" id="s10-t2">sélection</span>
        </h1>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const f = (n) => n / 30;
          // showroom = fin de S09 (caméra ×0,62 autour de (530, 490), descendue de 610 px)
          gsap.set("#s10-cam", { transformOrigin: "530px 490px", scale: 0.62, y: 610 });
          gsap.set("#s10-phone", { x: 180, y: -19.1, scale: 1.06, transformOrigin: "50% 50%" });
          gsap.set("#s10-hero", { x: 356, y: 656.2, scale: 0.38 });
          gsap.set("#s10-bezel", { opacity: 0 });
          gsap.set(["#s10-neon", "#s10-interior"], { opacity: 1 });
          // photo de la carte : grande carte S11 (620×1120) réduite à 250 px de large
          const PHOTO = { x: 124, y: 494, scale: 250 / 620 };
          const S11_CARD = { x: 100, y: 450, scale: 1 };
          gsap.set("#s10-trace-path", { strokeDasharray: 1, strokeDashoffset: 1 });
          // étincelles du favori : positions dérivées de l'indice (déterministes)
          const sparks = document.getElementById("s10-sparks");
          const NS = "http://www.w3.org/2000/svg";
          const dots = [];
          for (let i = 0; i < 8; i++) {
            const c = document.createElementNS(NS, "circle");
            c.setAttribute("cx", "842");
            c.setAttribute("cy", "528");
            c.setAttribute("r", String(i % 2 ? 5 : 7));
            c.setAttribute("opacity", "0");
            sparks.appendChild(c);
            dots.push(c);
          }

          // ---- 0–12 : la carte entre au-dessus du showroom, puis image et nom
          tl.fromTo("#s10-card", { opacity: 0, y: -40, scale: 0.96, transformOrigin: "50% 50%" }, { opacity: 1, y: 0, scale: 1, duration: f(12), ease: "power3.out" }, 0);
          tl.fromTo("#s10-photo", { ...PHOTO, opacity: 0, y: PHOTO.y - 30 }, { ...PHOTO, opacity: 1, duration: f(10), ease: "power3.out" }, f(3));
          tl.fromTo(["#s10-name", "#s10-handle"], { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: f(9), ease: "power3.out", stagger: f(2) }, f(5));
          tl.fromTo(["#s10-heart", "#s10-fav"], { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: f(8), ease: "power3.out", stagger: f(2) }, f(7));
          tl.fromTo("#s10-trace-path", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: f(8), ease: "power2.out" }, f(6));
          tl.fromTo("#s10-t1", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: f(12), ease: "power3.out" }, f(2));
          tl.fromTo("#s10-t2", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: f(12), ease: "power3.out" }, f(5));

          // ---- 18 : cœur animé une seule fois
          tl.to("#s10-heart", { scale: 1.35, duration: f(4), ease: "power2.out" }, f(18));
          tl.to("#s10-heart", { scale: 1, duration: f(8), ease: "back.out(2)" }, f(22));
          tl.fromTo("#s10-heart-fill", { opacity: 0 }, { opacity: 1, duration: f(3), ease: "power1.out" }, f(18));
          tl.to("#s10-fav", { scale: 1.06, duration: f(4), ease: "power2.out", yoyo: true, repeat: 1 }, f(18));
          dots.forEach((c, i) => {
            const a = (i / 8) * Math.PI * 2 + 0.3;
            const d = 70 + (i % 3) * 14;
            tl.fromTo(c, { attr: { cx: 842, cy: 528 }, opacity: 0 }, { attr: { cx: 842 + Math.cos(a) * d, cy: 528 + Math.sin(a) * d }, opacity: 1, duration: f(6), ease: "power2.out" }, f(18));
            tl.to(c, { opacity: 0, duration: f(6), ease: "power1.in" }, f(24));
          });

          // ---- sortie 41–51 : la photo grandit vers le plan produit suivant (S11)
          const T = f(41);
          tl.to("#s10-photo", { ...S11_CARD, duration: f(10), ease: "power3.inOut" }, T);
          tl.to(["#s10-card", "#s10-name", "#s10-handle", "#s10-heart", "#s10-fav", "#s10-trace"], { opacity: 0, duration: f(8), ease: "power2.in" }, T);
          tl.to("#s10-show", { opacity: 0, y: 120, duration: f(9), ease: "power2.in" }, T);
          tl.to(["#s10-t1", "#s10-t2"], { opacity: 0, y: -20, duration: f(7), ease: "power2.in", stagger: f(1) }, T);

          window.__timelines["s10-selection"] = tl;
        })();
      </script>
    </template>
