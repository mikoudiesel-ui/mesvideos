        .s12-tile .neon-ov {

        #s12-nav {

        }
        .s12-card {
          left: 0;
          top: 0;
          width: 620px;
          height: 1120px;
          border-radius: 36px;
          transform-origin: 0 0;
        }
        #s12-shade {
          position: absolute;
          left: 0;
          top: 0;
          width: 620px;
          height: 1120px;
          border-radius: 36px;
          transform-origin: 0 0;
          background: linear-gradient(180deg, rgba(20, 10, 8, 0) 70%, rgba(20, 10, 8, 0.45) 100%);
        }
        #s12-hero {
          position: absolute;
          left: 0;
          top: 0;
          width: 870px;
          height: 1668px;
          transform-origin: 0 0;
        }
        #s12-hero img {
          display: block;
          width: 870px;
          height: 1668px;
        }
        #s12-trace path {
          fill: none;
          stroke: var(--coral);
          stroke-width: 4;
          stroke-linecap: round;
          filter: drop-shadow(0 0 8px rgba(255, 66, 105, 0.9));
        }
        #s12-finger {
          position: absolute;
          left: 0;
          top: 0;
          width: 657px;
          height: 1206px;
          transform-origin: 0 0;
        }
        #s12-finger img {
          display: block;
          width: 657px;
          height: 1206px;
        }
        #s12-ripple {
          opacity: 0;
        }
      </style>

      <div id="s12-root" data-composition-id="s12-contact" data-width="1080" data-height="1920" data-duration="1.1">
        <div class="phone" id="s12-phone">
          <div class="screen">
            <div class="statusbar">
              <span class="time">9:41</span>
              <span class="icons"><span class="bars"><i style="height: 8px"></i><i style="height: 12px"></i><i style="height: 16px"></i><i style="height: 20px"></i></span><span class="batt"><i></i></span></span>
            </div>
            <div id="s12-pc">
              <svg class="ico" viewBox="0 0 24 24" style="left: 26px; top: 70px; width: 40px; height: 40px; color: #f1e7ee"><path d="M15 5 L8 12 L15 19" /></svg>
              <div id="s12-hname" class="sans-b">BIKINIS SHOP</div>
              <svg class="ico" viewBox="0 0 24 24" style="left: 448px; top: 68px; width: 40px; height: 40px; color: #f1e7ee"><path d="M6 17 V11 a6 6 0 0 1 12 0 V17 L19.5 18.5 H4.5 Z" /><path d="M10 20.5 a2 2 0 0 0 4 0" /></svg>
              <svg class="ico" viewBox="0 0 24 24" style="left: 504px; top: 68px; width: 40px; height: 40px; color: #f1e7ee"><circle cx="12" cy="5" r="1.4" fill="currentColor" /><circle cx="12" cy="12" r="1.4" fill="currentColor" /><circle cx="12" cy="19" r="1.4" fill="currentColor" /></svg>
              <div class="s12-ava" id="s12-ava" role="img" aria-label="Avatar BIKINIS SHOP (illustration)"></div>
              <svg viewBox="0 0 572 1012" style="left: 0; top: 0; width: 572px; height: 1012px; overflow: visible"><ellipse cx="286" cy="196" rx="92" ry="92" style="fill: none; stroke: #ff4269; stroke-width: 4; filter: drop-shadow(0 0 8px rgba(255, 66, 105, 0.9))" /></svg>
              <div id="s12-name" class="serif">BIKINIS SHOP</div>
              <div id="s12-handle" class="sans">@daya_na990</div>
              <div id="s12-msg" class="btn-coral">Message</div>
              <div id="s12-more"><svg class="ico" viewBox="0 0 24 24" style="width: 30px; height: 30px"><path d="M6 9 L12 15 L18 9" /></svg></div>
              <svg class="ico s12-tab" viewBox="0 0 24 24" style="left: 87px; color: #f1e7ee"><rect x="4" y="4" width="4" height="4" fill="currentColor" stroke="none" /><rect x="10" y="4" width="4" height="4" fill="currentColor" stroke="none" /><rect x="16" y="4" width="4" height="4" fill="currentColor" stroke="none" /><rect x="4" y="10" width="4" height="4" fill="currentColor" stroke="none" /><rect x="10" y="10" width="4" height="4" fill="currentColor" stroke="none" /><rect x="16" y="10" width="4" height="4" fill="currentColor" stroke="none" /><rect x="4" y="16" width="4" height="4" fill="currentColor" stroke="none" /><rect x="10" y="16" width="4" height="4" fill="currentColor" stroke="none" /><rect x="16" y="16" width="4" height="4" fill="currentColor" stroke="none" /></svg>
              <svg class="ico s12-tab" viewBox="0 0 24 24" style="left: 267px"><path d="M5 8 H19 L18 20 H6 Z" /><path d="M9 8 V6.5 a3 3 0 0 1 6 0 V8" /></svg>
              <svg class="ico s12-tab" viewBox="0 0 24 24" style="left: 447px"><path d="M12 20 C 5 15, 3 11.5, 3 8.5 a4.5 4.5 0 0 1 9 -1 a4.5 4.5 0 0 1 9 1 C 21 11.5, 19 15, 12 20 Z" /></svg>
              <div id="s12-tabbar"></div>
              <div class="photo-card s12-tile" id="s12-tile-blue" role="img" aria-label="Bleu fleuri"><div class="bg studio"></div><div class="mini-hero"></div><div class="neon-ov neon"></div></div>
              <div class="photo-card s12-tile rose" id="s12-tile-pink" role="img" aria-label="Rose"></div>
              <div class="photo-card s12-tile vert" id="s12-tile-green" role="img" aria-label="Vert"></div>
              <div id="s12-nav">
                <svg class="ico" viewBox="0 0 24 24" style="left: 40px"><path d="M4 11 L12 4 L20 11 V20 H14.5 V14.5 H9.5 V20 H4 Z" /></svg>
                <svg class="ico" viewBox="0 0 24 24" style="left: 150px"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5 L21 21" /></svg>
                <svg class="ico" viewBox="0 0 24 24" style="left: 266px"><rect x="3" y="6" width="18" height="12" rx="3" /><path d="M12 9 V15 M9 12 H15" /></svg>
                <svg class="ico" viewBox="0 0 24 24" style="left: 382px"><path d="M4 5 H20 V16 H13 L8.5 20 V16 H4 Z" /></svg>
                <svg class="ico" viewBox="0 0 24 24" style="left: 492px"><circle cx="12" cy="8" r="4" /><path d="M4.5 20 a7.5 7.5 0 0 1 15 0" /></svg>
              </div>
            </div>
          </div>
          <div class="island"></div>
        </div>

        <svg class="fx-svg" id="s12-fx" viewBox="0 0 1080 1920">
          <rect id="s12-ripple" x="442" y="980" width="240" height="66" rx="16" ry="16" fill="none" stroke="#ff4269" stroke-width="4" />
          <ellipse id="s12-ring" class="ring" cx="562" cy="1013" rx="120" ry="33" style="opacity: 0" />
        </svg>
        <svg class="fx-svg" id="s12-trace" viewBox="0 0 1080 1920"><path id="s12-trace-path" pathLength="1" d="M205 1016 C 205 1100, 340 1084, 440 1013" /></svg>

        <div class="photo-card s12-card" id="s12-vig"><div class="bg studio"></div></div>
        <div id="s12-hero"><img src="assets/img/bleu-detoure.png" alt="Bikini bleu fleuri (illustration)" /></div>
        <div id="s12-shade"></div>

        <div id="s12-finger"><img src="assets/img/main-doigt.png" alt="Doigt qui appuie sur Message (illustration)" /></div>

        <h1 class="scene-title" id="s12-title" style="font-size: 64px">
          <span class="ln" id="s12-t1">Un message</span>
          <span class="ln coral" id="s12-t2">pour commencer.</span>
        </h1>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const f = (n) => n / 30;
          // vignette = fin de S11 : carte 620×1120 ×0,371 en (90, 600) ; mannequin séparé du fond de carte
          const VIG = { x: 90, y: 600, scale: 230 / 620 };
          const HERO_VIG = { x: 98.05, y: 605.05, scale: 0.233524 };
          const HERO_S13 = { x: 284.8, y: 459.4, scale: 0.491607 };
          gsap.set(["#s12-vig", "#s12-shade"], VIG);
          gsap.set("#s12-hero", HERO_VIG);
          // avatar du profil (écran 572×1012) : centre (286, 196), rayon 85
          gsap.set("#s12-ava", { x: 286 - 458 * 0.217949, y: 196 - 450 * 0.217949, scale: 0.217949, clipPath: "circle(390px at 458px 450px)" });
          const TILE = 170 / 630;
          gsap.set("#s12-tile-blue", { x: 21, y: 560, scale: TILE });
          gsap.set("#s12-tile-pink", { x: 201, y: 560, scale: TILE });
          gsap.set("#s12-tile-green", { x: 381, y: 560, scale: TILE });
          gsap.set("#s12-trace-path", { strokeDasharray: 1, strokeDashoffset: 1 });
          // doigt : pointe (140, 135) de l'image, ×0,9, posée sur le bouton Message en (640, 1013)
          const PRESS = { x: 640 - 140 * 0.9, y: 1013 - 135 * 0.9, scale: 0.9 };

          // ---- 0–6 : téléphone et vignette se placent
          tl.fromTo("#s12-phone", { opacity: 0, x: 90 }, { opacity: 1, x: 0, duration: f(7), ease: "power3.out" }, 0);
          tl.fromTo("#s12-trace-path", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: f(10), ease: "power2.out" }, f(2));
          tl.fromTo("#s12-t1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: f(9), ease: "power3.out" }, f(1));
          tl.fromTo("#s12-t2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: f(9), ease: "power3.out" }, f(3));

          // ---- 6–18 : le doigt rejoint le bouton, qui réagit (clic à l'image 15)
          tl.fromTo("#s12-finger", { x: PRESS.x + 300, y: PRESS.y + 430, scale: 0.9, opacity: 0 }, { ...PRESS, opacity: 1, duration: f(8), ease: "power3.out" }, f(6));
          tl.to("#s12-finger", { y: PRESS.y + 8, duration: f(2), ease: "power1.in" }, f(14));
          tl.to("#s12-finger", { y: PRESS.y, duration: f(5), ease: "power2.out" }, f(16));
          tl.to("#s12-msg", { scale: 0.93, duration: f(2), ease: "power1.in" }, f(14));
          tl.to("#s12-msg", { scale: 1, duration: f(6), ease: "back.out(2.2)" }, f(16));
          // ---- 16–24 : retour visuel du contact (onde), sans échange inventé
          tl.fromTo("#s12-ripple", { opacity: 0, scale: 1, transformOrigin: "50% 50%" }, { opacity: 0.95, scale: 1.08, duration: f(3), ease: "power2.out", immediateRender: false }, f(16));
          tl.to("#s12-ripple", { opacity: 0, scale: 1.35, duration: f(6), ease: "power2.in" }, f(19));

          // ---- sortie 24–33 : la trace rejoint le cercle de la signature, la vignette devient le produit
          const T = f(24);
          tl.to("#s12-finger", { x: PRESS.x + 240, y: PRESS.y + 360, opacity: 0, duration: f(7), ease: "power2.in" }, T);
          tl.to("#s12-phone", { x: 140, opacity: 0, duration: f(8), ease: "power2.in" }, T);
          tl.to("#s12-trace", { opacity: 0, duration: f(5), ease: "power2.in" }, T);
          tl.fromTo("#s12-ring", { opacity: 0 }, { opacity: 1, duration: f(5), ease: "power2.out", immediateRender: false }, T);
          tl.to("#s12-ring", { attr: { cx: 510, cy: 1270, rx: 280, ry: 48 }, duration: f(9), ease: "power3.inOut" }, T);
          tl.to(["#s12-vig", "#s12-shade"], { opacity: 0, duration: f(7), ease: "power2.inOut" }, T);
          tl.to("#s12-hero", { ...HERO_S13, duration: f(9), ease: "power3.inOut" }, T);
          tl.to(["#s12-t1", "#s12-t2"], { opacity: 0, y: -20, duration: f(6), ease: "power2.in", stagger: f(1) }, T);

          window.__timelines["s12-contact"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
