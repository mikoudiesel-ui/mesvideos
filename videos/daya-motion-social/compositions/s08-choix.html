      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const f = (n) => n / 30;
          // avatar dans l'écran du téléphone (coordonnées de l'écran 496×1006) : centre (248, 218), rayon 85
          gsap.set("#s08-avatar", { x: 248 - 458 * 0.217949, y: 218 - 450 * 0.217949, scale: 0.217949, clipPath: "circle(390px at 458px 450px)" });
          const TILE = 152 / 630;
          gsap.set("#s08-tile-blue", { x: 10, y: 600, scale: TILE });
          gsap.set("#s08-tile-pink", { x: 172, y: 600, scale: TILE });
          gsap.set("#s08-tile-green", { x: 334, y: 600, scale: TILE });
          const MINI = 76 / 630;
          gsap.set("#s08-mini-blue", { x: 26, y: 88, scale: MINI });
          gsap.set("#s08-mini-pink", { x: 112, y: 88, scale: MINI });
          gsap.set("#s08-mini-green", { x: 198, y: 88, scale: MINI });

          // ---- 0–18 : le téléphone entre ; les coques de widgets attendent (raccord S07)
          tl.fromTo("#s08-phone", { x: -150, y: 80, rotation: -12, opacity: 0, transformOrigin: "50% 50%" }, { x: 0, y: 0, rotation: -4, opacity: 1, duration: f(18), ease: "power3.out" }, 0);
          tl.fromTo("#s08-floor", { opacity: 0 }, { opacity: 1, duration: f(12), ease: "power2.out" }, f(6));
          tl.fromTo("#s08-t1", { opacity: 0, y: 34, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: f(12), ease: "power3.out" }, f(2));
          tl.fromTo("#s08-t2", { opacity: 0, y: 34, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: f(12), ease: "power3.out" }, f(5));

          // ---- chargement : un reflet balaie chaque coque vide jusqu'à l'arrivée de son contenu
          [["#s08-w-modele", 18], ["#s08-w-couleur", 24], ["#s08-w-dispo", 30]].forEach(([w, fr], i) => {
            tl.fromTo(`${w} .shim`, { backgroundPosition: "100% 0%" }, { backgroundPosition: "0% 0%", duration: f(12), ease: "sine.inOut" }, f(2 + 2 * i));
            tl.to(`${w} .shim`, { opacity: 0, duration: f(4), ease: "power1.out" }, f(fr));
          });

          // ---- widgets aux images 18, 24 et 30 (options de demande, sans confirmation de stock)
          [
            ["#s08-wc-modele", "#s08-mini-sel", 18],
            ["#s08-wc-couleur", "#s08-dot-sel", 24],
            ["#s08-wc-dispo", "#s08-wc-dispo .subi", 30],
          ].forEach(([wc, sel, fr]) => {
            tl.fromTo(wc, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: f(8), ease: "power3.out" }, f(fr));
            tl.fromTo(sel, { scale: 0.6, transformOrigin: "50% 50%" }, { scale: 1, duration: f(8), ease: "back.out(1.8)" }, f(fr + 2));
          });

          // ---- pose 30–99 : seule la sélection bleue pulse brièvement
          tl.to("#s08-tile-neon", { opacity: 0.35, duration: f(5), ease: "sine.inOut", yoyo: true, repeat: 1 }, f(60));

          // ---- sortie 99–117 : la caméra avance, le téléphone devient le cadre du showroom
          const T = f(99);
          tl.to("#s08-phone", { x: 180, y: -19.1, scale: 1.06, rotation: 0, duration: f(18), ease: "power3.inOut" }, T);
          tl.to("#s08-pc", { opacity: 0, duration: f(10), ease: "power2.in" }, T);
          tl.to(["#s08-w-modele", "#s08-wc-modele"], { x: 220, opacity: 0, duration: f(11), ease: "power2.in" }, T);
          tl.to(["#s08-w-couleur", "#s08-wc-couleur"], { x: 220, opacity: 0, duration: f(11), ease: "power2.in" }, T + f(2));
          tl.to(["#s08-w-dispo", "#s08-wc-dispo"], { x: 220, opacity: 0, duration: f(11), ease: "power2.in" }, T + f(4));
          tl.to("#s08-floor", { opacity: 0, duration: f(10), ease: "power2.in" }, T);
          tl.to(["#s08-t1", "#s08-t2"], { opacity: 0, y: -20, filter: "blur(10px)", duration: f(8), ease: "power2.in", stagger: f(1) }, T);

          window.__timelines["s08-choix"] = tl;
        })();
      </script>
