<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>daya_na990 — livraison isométrique</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      // The 3D world builds asynchronously (fonts → canvas textures → scene); hold the
      // runtime until it is drawable.
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.world = new Promise((resolve) => {
        window.__worldReady = resolve;
      });
    </script>
    <style>
      @font-face {
        font-family: "Unbounded";
        src: url("assets/fonts/unbounded-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "Unbounded";
        src: url("assets/fonts/unbounded-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Unbounded";
        src: url("assets/fonts/unbounded-latin-800-normal.woff2") format("woff2");
        font-weight: 800;
      }
      @font-face {
        font-family: "Unbounded";
        src: url("assets/fonts/unbounded-latin-900-normal.woff2") format("woff2");
        font-weight: 900;
      }
      @font-face {
        font-family: "Fraunces";
        src: url("assets/fonts/fraunces-latin-600-italic.woff2") format("woff2");
        font-weight: 600;
        font-style: italic;
      }
      @font-face {
        font-family: "Fraunces";
        src: url("assets/fonts/fraunces-latin-700-italic.woff2") format("woff2");
        font-weight: 700;
        font-style: italic;
      }
      :root {
        --ink: #2a1b3d;
        --coral: #ff4f70;
        --coral-deep: #d62f55;
        --coral-label: #ec3b64;
        --cream: #fff6ec;
        --sun: #ffc93c;
        --teal: #16a6a0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #ffe3d2;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Unbounded", sans-serif;
        color: var(--ink);
      }
      /* sub-composition slots fill the frame */
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      #gl {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #ffffff;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40" data-width="1080" data-height="1920">
      <!-- backdrop: warm golden-hour gradient, sun glow, grain -->
      <div
        id="el-background"
        data-composition-id="background"
        data-composition-src="compositions/background.html"
        data-start="0"
        data-duration="40"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- the 3D isometric world (Three.js, seeked by hf-seek) — assets/js/world.js -->
      <canvas id="gl" class="clip" width="1080" height="1920" data-start="0" data-duration="40" data-track-index="1" data-layout-allow-overflow></canvas>

      <!-- white flash that seals the phone-map → island match cut -->
      <div id="flash" class="clip" data-start="4.2" data-duration="1" data-track-index="2"></div>

      <!-- on-screen copy (8 sticker captions) -->
      <div
        id="el-captions"
        data-track-kind="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="40"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- brand lockup + call to action -->
      <div
        id="el-endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="36.4"
        data-duration="3.6"
        data-track-index="4"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- soundtrack: 120 BPM bed + foley, generated by tools/make_soundtrack.py -->
      <audio id="soundtrack" src="assets/audio/soundtrack.wav" data-start="0" data-duration="40" data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // ---- match-cut flash (phone map → real island) ----
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.55, duration: 0.38, ease: "power2.in" }, 4.22);
      tl.to("#flash", { opacity: 0, duration: 0.5, ease: "power2.out" }, 4.6);

      // ---- speed blur on the fastest camera legs: peaks at max velocity, sharp on landing ----
      [
        [4.15, 4.6, 5.05, 3.2],
        [9.95, 10.35, 10.85, 2.0],
        [32.3, 32.62, 33.1, 2.4],
        [35.55, 36.05, 36.6, 2.0],
      ].forEach(([a, peak, b, px]) => {
        tl.fromTo("#gl", { filter: "blur(0px)" }, { filter: "blur(" + px + "px)", duration: peak - a, ease: "power2.in", immediateRender: false }, a);
        tl.to("#gl", { filter: "blur(0px)", duration: b - peak, ease: "power2.out" }, peak);
      });

      window.__timelines["main"] = tl;
    </script>
    <script type="module" src="assets/js/world.js"></script>
  </body>
</html>
