  <script>
    (function () {
      var FID = "01-lundi", DUR = 3.3;
      function $(id) { return document.getElementById("f01-" + id); }
      var camEl = $("cam"), fgEl = $("fg"), focusEl = $("focus"), pencilIn = $("pencil-in");

      /* ---- la caméra : état animé (x reste à 0 tout le plan, jamais d'aller-retour) ---- */
      // s : échelle, y : translation (négatif = la caméra descend), b : flou de bougé (px)
      var C = { s: 1, y: 0, b: 0 };
      function render() {
        camEl.style.transform = "translate(0px," + C.y.toFixed(2) + "px) scale(" + C.s.toFixed(5) + ")";
        // premier plan : plus proche, il bouge 1,5 fois plus que la page
        var fs = 1 + (C.s - 1) * 1.5, fy = C.y * 1.5;
        fgEl.style.transform = "translate(0px," + fy.toFixed(2) + "px) scale(" + fs.toFixed(5) + ")";
        focusEl.style.filter = C.b > 0.01 ? "blur(" + C.b.toFixed(2) + "px)" : "none";
        pencilIn.style.filter = "blur(" + (6 + C.b * 1.5).toFixed(2) + "px)";
      }

      var tl = gsap.timeline({ paused: true, onUpdate: render });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      // groupes de la page qui se retourne : l'axe est le bord haut (incliné de -2deg comme la page)
      gsap.set($("flip"), { rotation: -2, rotationX: 0, transformPerspective: 1700, transformOrigin: "540px 230px" });
      gsap.set($("flip-in"), { rotation: 2, transformOrigin: "540px 230px" });

      /* ---- piste caméra ---- */
      // 0.00 → 0.55 dérive linéaire (1,4 %/s), 0.55 → 1.20 poussée vers le post-it (cam-postit), power3.out
      ft(C, { s: 1.0, y: 0 }, { s: 1.008, y: 0, duration: 0.55, ease: "none" }, 0);
      ft(C, { s: 1.008, y: 0 }, { s: 1.25, y: -60, duration: 0.65, ease: "power3.out" }, 0.55);
      // 1.20 → 3.00 dérive qui ne s'arrête pas
      ft(C, { s: 1.25 }, { s: 1.295, duration: 1.8, ease: "none" }, 1.20);
      // 3.00 → 3.30 whip vers le bas (power3.in) : y -260, échelle 1.35, flou 0 → 8 px (en cours à la couture)
      ft(C, { s: 1.295, y: -60, b: 0 }, { s: 1.35, y: -260, b: 8, duration: 0.30, ease: "power3.in" }, 3.00);

      /* ---- scène 1 : la page « Lundi » et le post-it qui arrive ---- */
      // 0.20 le halo de la lampe vacille une fois
      ft($("lamp"), { opacity: 1 }, { opacity: 0.8, duration: 0.03, ease: "none" }, 0.20);
      ft($("lamp"), { opacity: 0.8 }, { opacity: 1, duration: 0.10, ease: "power2.out" }, 0.23);
      // 0.60 le post-it arrive depuis la caméra : trop grand, flou, tourné ; il se pose en (470, 700) à 5deg (expo.out, 0.4 s)
      ft($("postit"), { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 0.60);
      ft($("postit"), { scale: 1.8, rotation: 12, x: 40, y: 90, transformOrigin: "50% 50%" },
        { scale: 1, rotation: 5, x: 0, y: 0, duration: 0.40, ease: "expo.out" }, 0.60);
      // flou sur une courbe un peu plus lente (hold-the-streak) : la dernière brume se dissipe juste après la pose
      ft($("postit"), { filter: "blur(14px)" }, { filter: "blur(0px)", duration: 0.40, ease: "power2.out" }, 0.60);
      // son ombre : lointaine et molle tant qu'il vole, elle se resserre sous lui à 1.00 (il colle)
      ft($("pshadow"), { opacity: 0, scale: 1.3, rotation: 9, x: 120, y: 190, filter: "blur(46px)" },
        { opacity: 0.42, scale: 1.06, rotation: 5, x: 34, y: 64, filter: "blur(26px)", duration: 0.40, ease: "expo.out" }, 0.60);
      ft($("pshadow"), { opacity: 0.42, scale: 1.06, x: 34, y: 64, filter: "blur(26px)" },
        { opacity: 0.30, scale: 1.0, x: 6, y: 16, filter: "blur(10px)", duration: 0.30, ease: "power3.out" }, 1.00);
      // 1.20 le crayon roule de 20 px (perpendiculaire à son axe), ses facettes tournent
      ft($("pencil-in"), { y: 0 }, { y: 20, duration: 0.50, ease: "power3.out" }, 1.20);
      ft($("facets"), { y: 0 }, { y: -12, duration: 0.50, ease: "power3.out" }, 1.20);

      /* ---- scène 2 : la promesse ---- */
      // 1.90 la case du post-it pulse une fois
      ft($("check"), { scale: 1 }, { scale: 1.15, duration: 0.12, ease: "power3.out" }, 1.90);
      ft($("check"), { scale: 1.15 }, { scale: 1, duration: 0.18, ease: "power2.inOut" }, 2.02);
      // 2.88 la page « Mercredi » existe sous la page « Lundi » (encore couverte) ; 2.90 la page se retourne vers le haut
      ft($("page2"), { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, 2.88);
      ft($("flip"), { rotationX: 0 }, { rotationX: -70, duration: 0.40, ease: "power3.in" }, 2.90);
      ft($("flip-in"), { filter: "brightness(1)" }, { filter: "brightness(0.72)", duration: 0.40, ease: "power2.in" }, 2.90);

      /* ---- la phrase de la voix : mot par mot, chaque mot 1 image avant son repère ---- */
      Array.prototype.forEach.call(document.querySelectorAll("#f01-sub .pm-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - 1 / 30;
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, cue);
      });
      // 2.21 la boîte rouge se trace sous « commencer. » (de la gauche, 0.16 s)
      ft($("box"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 2.21);
      // 2.70 le sous-titre s'en va (flou 6, 0.14 s)
      ft($("sub"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.70);

      // longueur exacte du plan
      tl.set({}, {}, DUR);
      // première image = handoff_in, avant tout seek
      render();
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
