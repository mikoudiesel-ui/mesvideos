      ft($("arrow-in"), { y: 0 }, { y: 10, duration: 0.30, ease: "power2.inOut" }, 3.20);
      ft($("arrow-in"), { y: 10 }, { y: 0, duration: 0.30, ease: "power2.inOut" }, 3.50);
      // poussières : elles apparaissent dans la lumière et montent lentement (valeurs fixes, aucun hasard)
      var dust = [
        [0.55, -46, 10], [0.4, -38, -8], [0.6, -52, 6], [0.45, -40, -10], [0.5, -34, 8], [0.55, -48, -6],
        [0.35, -30, 6], [0.45, -44, -8], [0.3, -28, 4], [0.35, -36, -4], [0.4, -42, 6], [0.35, -30, -6]
      ];
      dust.forEach(function (d, i) {
        var el = $("d" + (i + 1)), t0 = 2.40 + (i % 6) * 0.08;
        ft(el, { opacity: 0 }, { opacity: d[0], duration: 0.40, ease: "power2.out" }, t0);
        ft(el, { x: 0, y: 0 }, { x: d[2], y: d[1], duration: DUR - t0, ease: "none" }, t0);
      });

      // longueur exacte du plan
      tl.set({}, {}, DUR);
      // première image = handoff_in, avant tout seek
      render();
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
