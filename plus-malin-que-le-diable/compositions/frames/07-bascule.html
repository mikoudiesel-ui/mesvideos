  <div id="root" data-composition-id="07-bascule" data-width="1080" data-height="1920" data-duration="3.36">

    <!-- noir pur (coupe franche, rien à l'écran au départ) -->
    <div id="f07-ground" class="clip pm-layer" data-start="0" data-duration="3.36" data-track-index="0">

    <!-- la question, centrée sur y 760, mot par mot (temps locaux) ; la caméra dérive 1.00 → 1.03 -->

        </div>
      </div>
    </div>

    <!-- la fêlure d'or verticale (handoff_out), hors caméra pour tenir x 540, y 300 → 1300 exactement -->
    <div id="f07-crackl" class="clip pm-layer" data-start="0" data-duration="3.36" data-track-index="2">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "07-bascule", DUR = 3.36, F = 1 / 30;
      function $(id) { return document.getElementById("f07-" + id); }

      var tl = gsap.timeline({ paused: true });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      /* ---- découpe : chaque mot en lettres inline-block (on anime x, jamais letterSpacing) ---- */
      var SPREAD = 36; // px d'écart par rang de lettre depuis le centre du mot
      Array.prototype.forEach.call(document.querySelectorAll("#f07-type .f07-word"), function (w) {
        var txt = w.textContent, n = txt.length;
        w.textContent = "";
        var letters = [];
        for (var i = 0; i < n; i++) {
          var l = document.createElement("span");
          l.className = "f07-l";
          l.textContent = txt.charAt(i);
          w.appendChild(l);
          letters.push(l);
        }
        // chaque mot converge sur son repère (1 image avant) : x écarté → 0, flou 12 → 0, 0.4 s expo.out
        var cue = parseFloat(w.getAttribute("data-cue")) - F;
        letters.forEach(function (l, i) {
          var dx = (i - (n - 1) / 2) * SPREAD;
          ft(l, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, cue);
          ft(l, { x: dx, filter: "blur(12px)" }, { x: 0, filter: "blur(0px)", duration: 0.40, ease: "expo.out" }, cue);
        });
      });

      /* ---- piste caméra : dérive linéaire 1.00 → 1.03 sur tout le plan, centrée sur la question ---- */
      ft($("cam"), { scale: 1, transformOrigin: "540px 760px" }, { scale: 1.03, duration: DUR, ease: "none" }, 0);

      /* ---- 2.40 tenue : la ligne vit, scale 1 → 1.03 ---- */
      ft($("type"), { scale: 1 }, { scale: 1.03, duration: 0.60, ease: "none" }, 2.40);
      /* ---- 2.80 la ligne s'efface (flou 6, 0.2 s) ---- */
      ft($("type"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.20, ease: "power2.in" }, 2.80);

      /* ---- 3.00 la fêlure d'or se trace depuis le centre, vers le haut et le bas (scaleY 0 → 1, 0.3 s power2.out) ---- */
      ft($("crack"), { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none" }, 3.00);
      ft($("crack"), { scaleY: 0 }, { scaleY: 1, duration: 0.30, ease: "power2.out" }, 3.00);
      ft($("halo"), { opacity: 0, scaleY: 0, scaleX: 0.6 }, { opacity: 0.7, scaleY: 1, scaleX: 1, duration: 0.26, ease: "power2.out" }, 3.00);
      // 3.26 → 3.36 elle commence à s'ouvrir : la lueur s'élargit et s'intensifie (en cours à la couture)
      ft($("halo"), { opacity: 0.7, scaleX: 1 }, { opacity: 1, scaleX: 1.5, duration: 0.10, ease: "power2.in" }, 3.26);

      // longueur exacte du plan
      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
