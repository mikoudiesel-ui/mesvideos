    (function () {

      /* ---- les bords déchirés : une seule ligne en dents de scie, partagée par les deux moitiés (elles s'emboîtent) ---- */
      var JAG = [0, 14, -10, 6, -16, 9, -4, 17, -12, 3, -8, 15, -14, 7, -2, 12, -17, 5, -9, 16, -6, 10, -13, 2, -11, 18, -5, 8, -15, 11, -3, 13, 0];
      function edge(base) { return JAG.map(function (d, i) { return (base + d) + "px " + (i * 60) + "px"; }); }
      var eL = edge(1240), eR = edge(40);
      var polyL = "polygon(0px 0px, " + eL.join(", ") + ", 0px 1920px)";
      var polyR = "polygon(" + eR.join(", ") + ", 1280px 1920px, 1280px 0px)";
      ["rimL", "faceL"].forEach(function (id) { $(id).style.clipPath = polyL; });
      ["rimR", "faceR"].forEach(function (id) { $(id).style.clipPath = polyR; });

      var C = { s: 1.15, x: 0, b: 0 };

        focusEl.style.filter = C.b > 0.01 ? "blur(" + C.b.toFixed(2) + "px)" : "none";
      }

      var tl = gsap.timeline({ paused: true, onUpdate: render });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      /* ---- piste caméra ---- */
      // 0.00 → 0.60 poussée à travers la déchirure (1.15 → 1.00), puis dérive 1.00 → 1.02
      ft(C, { s: 1.15 }, { s: 1.0, duration: 0.60, ease: "power3.out" }, 0);
      ft(C, { s: 1.0 }, { s: 1.02, duration: 1.90, ease: "none" }, 0.60);
      // scène 2 : dérive latérale x +20
      ft(C, { x: 0 }, { x: 20, duration: 2.95, ease: "none" }, 2.50);
      // 5.45 → 5.73 recul vers le cadrage de la couverture, flou de bougé 0 → 6 px (handoff_out : cam(0,0,1.00), flou 6)
      ft(C, { s: 1.02, x: 20, b: 0 }, { s: 1.0, x: 0, b: 6, duration: 0.28, ease: "power3.inOut" }, 5.45);

        { scale: 1, y: 0, rotation: -3, filter: "blur(0px)", duration: 0.60, ease: "expo.out" }, 0.30);
      // 1.40 un reflet doré balaie la couverture
      ft($("sheen"), { x: 0, rotation: 20 }, { x: 1150, rotation: 20, duration: 0.40, ease: "power2.inOut" }, 1.40);

      ft($("halfL"), { x: -520, rotation: -7 }, { x: -760, rotation: -9, duration: 0.55, ease: "power3.in" }, 2.50);

      // 3.20 les trois excuses tombent à gauche, empilées

        var t = 3.20 + i * 0.12;
        ft($(id), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, t);
        ft($(id), { y: -70, rotation: -4, filter: "blur(6px)" }, { y: 0, rotation: 0, filter: "blur(0px)", duration: 0.40, ease: "expo.out" }, t);
      });
      // 3.99 / 4.76 / 5.11 chaque excuse est barrée de rouge, de gauche à droite (deux lignes, 0.25 s en tout)
      [["x1a", "x1b", 3.99], ["x2a", "x2b", 4.76], ["x3a", "x3b", 5.11]].forEach(function (k) {
        ft($(k[0]), { opacity: 1, scaleX: 0, rotation: -2 }, { opacity: 1, scaleX: 1, rotation: -2, duration: 0.13, ease: "power2.out" }, k[2]);
        ft($(k[1]), { opacity: 1, scaleX: 0, rotation: -2 }, { opacity: 1, scaleX: 1, rotation: -2, duration: 0.12, ease: "power2.out" }, k[2] + 0.13);
      });
      // 5.40 les excuses s'effacent vers la gauche et sortent du point (profondeur de champ) ; encore en fondu à la couture
      ["ex1", "ex2", "ex3"].forEach(function (id) {
        ft($(id), { x: 0, opacity: 1, filter: "blur(0px)" }, { x: -70, opacity: 0.3, filter: "blur(5px)", duration: 0.33, ease: "power2.in" }, 5.40);
      });
      // 5.40 la couverture revient en (260, 360) pendant le recul de la caméra
      ft($("cover"), { x: 160 }, { x: 0, duration: 0.33, ease: "power3.inOut" }, 5.40);

      /* ---- les phrases de la voix : mot par mot, chaque mot 1 image avant son repère ---- */
      Array.prototype.forEach.call(document.querySelectorAll("#f08-subs .pm-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - 1 / 30;
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, cue);
      });
      // 1.02 le trait de crête doré sous « malin »
      ft($("stroke"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 1.02);
      // 2.20 la première phrase s'en va
      ft($("subA"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.20);
      // 3.92 la boîte dorée se trace sous « ruses, »
      ft($("box"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 3.92);
      // 5.45 la seconde phrase s'en va
      ft($("subB"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 5.45);

      tl.set({}, {}, DUR);
      render();
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
