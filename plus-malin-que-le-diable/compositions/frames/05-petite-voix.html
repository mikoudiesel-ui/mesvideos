      /* ---- la caméra : x = position de la caméra (positif = vers la droite), s = échelle, b = flou de bougé (px) ---- */
      var C = { x: 220, s: 1.15, b: 8 };
      function render() {
        camEl.style.transform = "translate(" + (-C.x).toFixed(2) + "px,0px) scale(" + C.s.toFixed(5) + ")";

        pencilIn.style.filter = "blur(" + (6 + C.b * 1.5).toFixed(2) + "px)";
      }

      var tl = gsap.timeline({ paused: true, onUpdate: render });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      // 2.40 l'ombre à cornes se lève depuis le bas droit de la page (multiply, flou 10)
      ft($("shadow"), { opacity: 0 }, { opacity: 0.55, duration: 0.30, ease: "power2.out" }, 2.40);
      ft($("shadow"), { y: 400, scale: 0.7, transformOrigin: "380px 900px" }, { y: 0, scale: 1, duration: 0.60, ease: "power3.out" }, 2.40);
      // le liseré doré s'éteint presque sous l'ombre
      ft($("rim"), { opacity: 0.55 }, { opacity: 0.18, duration: 0.50, ease: "power2.out" }, 2.40);
      // profondeur de champ : le post-it et le téléphone se floutent un peu, l'ombre prend le regard
      ft($("postit"), { "--dof": "0px", opacity: 1 }, { "--dof": "3px", opacity: 0.8, duration: 0.60, ease: "power2.inOut" }, 2.40);
      ft($("phone"), { "--dof": "0px" }, { "--dof": "3px", duration: 0.60, ease: "power2.inOut" }, 2.40);
      // 3.15 deux petits yeux rouges s'ouvrent dans l'ombre
      ft([$("eye1"), $("eye2")], { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.12, ease: "power3.out" }, 3.15);
      // 3.40 → 3.83 le téléphone revient au net (il est le prochain sujet)
      ft($("phone"), { "--dof": "3px" }, { "--dof": "0px", duration: 0.40, ease: "power2.inOut" }, 3.40);
      // 3.55 l'écran du téléphone commence à s'allumer (en cours à la couture)
      ft($("lock"), { opacity: 0 }, { opacity: 0.6, duration: 0.28, ease: "power2.in" }, 3.55);

      /* ---- la phrase de la voix : mot par mot, chaque mot 1 image avant son repère ---- */
      Array.prototype.forEach.call(document.querySelectorAll("#f05-subs .pm-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - 1 / 30;
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, cue);
      });
      // 1.33 le trait de crête doré sous « talent. » (de la gauche, 0.35 s)
      ft($("stroke"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 1.33);
      // 2.10 le premier sous-titre s'en va
      ft($("sub1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.10);
      // 2.79 la boîte rouge unique se trace sous « petite voix »
      ft($("box"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 2.79);
      // 3.50 le second sous-titre s'en va
      ft($("sub2"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 3.50);

      // longueur exacte du plan
      tl.set({}, {}, DUR);
      // première image = handoff_in, avant tout seek
      render();
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
