  <script>
    (function () {
      var FID = "06-excuses", DUR = 5.72, F = 1 / 30;
      function $(id) { return document.getElementById("f06-" + id); }
      var camEl = $("cam"), focusEl = $("focus");

      /* ---- la caméra : x et y restent à 0 tout le plan (aucun aller-retour) ---- */
      // s : échelle, b : flou de bougé (px)
      var C = { s: 1.2, b: 6 };
      function render() {
        camEl.style.transform = "translate(0px,0px) scale(" + C.s.toFixed(5) + ")";
        focusEl.style.filter = C.b > 0.01 ? "blur(" + C.b.toFixed(2) + "px)" : "none";
      }

      var tl = gsap.timeline({ paused: true, onUpdate: render });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      /* ---- piste caméra : atterrit (0.3 s) sur cam-phone, puis poussée lente linéaire jusqu'à 1.32 ; pas de mouvement à la fin ---- */
      ft(C, { s: 1.2, b: 6 }, { s: 1.235, b: 0, duration: 0.30, ease: "power3.out" }, 0);
      ft(C, { s: 1.235 }, { s: 1.32, duration: DUR - 0.30, ease: "none" }, 0.30);

      /* ---- 0.00 l'écran finit de s'allumer (verrouillage « 23:47 ») ---- */
      ft($("screen"), { opacity: 0.45 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0);

      /* ---- les notifications : elles tombent d'en haut (y -60 → 0, 0.3 s expo.out), opacité binaire, et poussent les autres vers le bas ---- */
      var STEP = 210;
      function drop(n, m, t) {
        tl.set($(n), { opacity: 1 }, t);
        ft($(n), { y: -60 }, { y: 0, duration: 0.30, ease: "expo.out" }, t);
        // cascade : le message claque 2 images après la carte
        ft($(m), { y: 24 }, { y: 0, duration: 0.16, ease: "power4.out" }, t + 2 * F);
      }
      function push(n, from, t) {
        ft($(n), { y: from }, { y: from + STEP, duration: 0.30, ease: "expo.out" }, t);
      }
      drop("n1", "m1", 0.57);
      push("n1", 0, 2.24); drop("n2", "m2", 2.24);
      push("n1", STEP, 3.61); push("n2", 0, 3.61); drop("n3", "m3", 3.61);

      /* ---- l'ombre grandit à chaque notification (et ses yeux avec elle) ---- */
      function grow(a, b, t) {
        ft([$("shadow"), $("eyes")], { scale: a }, { scale: b, duration: 0.55, ease: "power3.out" }, t);
      }
      grow(1, 1.12, 0.60);
      grow(1.12, 1.25, 2.27);
      grow(1.25, 1.40, 3.64);   // ses cornes atteignent le haut de la page

      /* ---- 4.50 le post-it « Commencer » glisse lentement hors champ ---- */
      ft($("postit"), { x: 0, rotation: 6 }, { x: 300, rotation: 6, duration: 0.80, ease: "power2.in" }, 4.50);

      /* ---- 5.50 l'écran s'éteint, puis la lampe : noir partout à 5.65 (coupe franche) ---- */
      ft($("screen"), { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "power2.in" }, 5.50);
      ft($("lamp"), { opacity: 0.7 }, { opacity: 0, duration: 0.15, ease: "power2.in" }, 5.50);
      ft($("black"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.in" }, 5.50);

      /* ---- la phrase de la voix : mot par mot, chaque mot 1 image avant son repère ---- */
      Array.prototype.forEach.call(document.querySelectorAll("#f06-subs .pm-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - F;
