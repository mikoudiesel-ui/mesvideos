  <script src="assets/js/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "09-repondre", DUR = 3.45;
      function $(id) { return document.getElementById("f09-" + id); }
      var camEl = $("cam"), focusEl = $("focus");

      var tl = gsap.timeline({ paused: true });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      // première image = handoff_in : couverture en (260, 360) tournée de -3deg, ombre minuscule, excuses qui partent
      gsap.set(camEl, { x: 0, y: 0, scale: 1, transformOrigin: "540px 860px" });
      gsap.set(focusEl, { filter: "blur(6px)" });
      gsap.set($("book"), { rotation: -3, y: 0, transformOrigin: "540px 760px" });
      gsap.set($("shadow"), { scale: 0.3 });

      /* ---- piste caméra : la caméra (échelle) et son flou de bougé, tweenés directement (seek-safe, sans callback) ;
              x et y restent à 0, jamais d'aller-retour latéral ---- */
      // 0.00 → 0.35 fin du recul de la séquence 08 (power3.out), le flou 6 px se résout : la mise au point (0.20)
      ft(camEl, { scale: 1.0 }, { scale: 0.99, duration: 0.35, ease: "power3.out" }, 0);
      ft(focusEl, { filter: "blur(6px)" }, { filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, 0);
      // 0.35 → 3.10 dérive lente qui ne s'arrête pas (0,99 → 1,02)
      ft(camEl, { scale: 0.99 }, { scale: 1.02, duration: 2.75, ease: "none" }, 0.35);
      // 3.10 → 3.45 settle vers cam-cover (échelle 1), flou 0 → 4 px (en cours à la couture)
      ft(camEl, { scale: 1.02 }, { scale: 1.0, duration: 0.35, ease: "power2.in" }, 3.10);
      ft(focusEl, { filter: "blur(0px)" }, { filter: "blur(4px)", duration: 0.35, ease: "power2.in" }, 3.10);

      /* ---- ce qui reste de la séquence 08 : les excuses s'effacent à gauche, l'ombre disparaît ---- */
      ft($("excs"), { x: 0, opacity: 1 }, { x: -90, opacity: 0, duration: 0.40, ease: "power2.out" }, 0);
      ft($("shadow"), { scale: 0.3, opacity: 0.55 }, { scale: 0, opacity: 0, duration: 0.45, ease: "power3.in" }, 0.20);

      /* ---- 0.60 le post-it « Commencer » revient : il vole du haut à gauche et se colle sur le coin de la couverture ---- */
      ft($("postit"), { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 0.60);
      ft($("postit"), { x: -620, y: -420, scale: 0.6 * 1.35, rotation: -22, filter: "blur(8px)", transformOrigin: "50% 50%" },
        { x: 0, y: 0, scale: 0.6, rotation: 6, filter: "blur(0px)", duration: 0.40, ease: "expo.out" }, 0.60);

      /* ---- 1.20 la case se coche au crayon : ☐ → ☑ ---- */
      ft($("tick"), { strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 0.30, ease: "power2.out" }, 1.20);
      ft($("check"), { scale: 1 }, { scale: 1.15, duration: 0.10, ease: "power3.out" }, 1.20);
      ft($("check"), { scale: 1.15 }, { scale: 1, duration: 0.20, ease: "power2.inOut" }, 1.30);

      /* ---- 2.10 la couverture monte (y -100) et se redresse ; 2.20 le bouton doré arrive du bas ---- */
      ft($("book"), { y: 0, rotation: -3 }, { y: -100, rotation: 0, duration: 0.40, ease: "power3.out" }, 2.10);
      ft($("cta"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 2.20);
      ft($("cta"), { y: 200, filter: "blur(8px)" }, { y: 0, filter: "blur(0px)", duration: 0.40, ease: "expo.out" }, 2.20);

      /* ---- la phrase de la voix : mot par mot, chaque mot 1 image avant son repère ---- */
      Array.prototype.forEach.call(document.querySelectorAll("#f09-subs .pm-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - 1 / 30;
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, cue);
      });
      // 1.38 le trait doré sous « répondre. » (de la gauche, 0.35 s)
      ft($("stroke"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 1.37);
      // 1.95 changement de phrase : la première s'en va (flou 6, 0.12 s)
      ft($("sub1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.12, ease: "power2.in" }, 1.95);
      // 2.79 la boîte dorée se trace sous « maintenant, » (de la gauche, 0.16 s)
      ft($("box"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 2.79);
      // 3.20 le sous-titre s'en va (flou 6, 0.14 s)
      ft($("sub2"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 3.20);

      // longueur exacte du plan
      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
