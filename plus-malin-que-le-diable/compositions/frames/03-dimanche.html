    (function () {
      var FID = "03-dimanche", DUR = 3.83;
      function $(id) { return document.getElementById("f03-" + id); }
      var camEl = $("cam"), fgEl = $("fg"), focusEl = $("focus"), pencilIn = $("pencil-in");

      /* ---- la caméra : état animé (x reste à 0 tout le plan, jamais d'aller-retour) ---- */
      // s : échelle, y : translation, b : flou de bougé (px) ; d : profondeur de champ du premier plan (px), o : son opacité
      var C = { s: 1.35, y: -260, b: 8, d: 0, o: 0.92 };
      function render() {
        camEl.style.transform = "translate(0px," + C.y.toFixed(2) + "px) scale(" + C.s.toFixed(5) + ")";
        // premier plan : plus proche, il bouge 1,5 fois plus que la page
        var fs = 1 + (C.s - 1) * 1.5, fy = C.y * 1.5;
        fgEl.style.transform = "translate(0px," + fy.toFixed(2) + "px) scale(" + fs.toFixed(5) + ")";
        focusEl.style.filter = C.b > 0.01 ? "blur(" + C.b.toFixed(2) + "px)" : "none";
        pencilIn.style.filter = "blur(" + (6 + C.d + C.b * 1.5).toFixed(2) + "px)";
        pencilIn.style.opacity = C.o.toFixed(3);
      }

      var tl = gsap.timeline({ paused: true, onUpdate: render });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      // la page « Mercredi » se retourne autour de son bord haut (incliné de -2deg comme la page) : à -70deg à la couture
      gsap.set($("flip"), { rotation: -2, rotationX: -70, transformPerspective: 1700, transformOrigin: "540px 230px" });
      gsap.set($("flip-in"), { rotation: 2, transformOrigin: "540px 230px", filter: "brightness(0.72)" });
      // le crayon reste dans l'état où la séquence 01 l'a laissé (roulé de 20 px)
      gsap.set(pencilIn, { y: 20 });
      gsap.set($("facets"), { y: -12 });

      /* ---- piste caméra ---- */
      // 0.00 → 0.30 atterrissage du whip : y -260 → 0, échelle 1.35 → 1.05, flou 8 → 0 (power3.out)
      ft(C, { s: 1.35, y: -260, b: 8 }, { s: 1.05, y: 0, b: 0, duration: 0.30, ease: "power3.out" }, 0);
      // 0.30 → 3.40 dérive qui ne s'arrête pas : 1.05 → 1.08
      ft(C, { s: 1.05 }, { s: 1.08, duration: 3.10, ease: "none" }, 0.30);
      // 3.40 → 3.83 bascule vers le téléphone : y 0 → 120, échelle 1.08 → 1.10, flou 0 → 6 px (power3.inOut)
      ft(C, { s: 1.08, y: 0, b: 0 }, { s: 1.10, y: 120, b: 6, duration: 0.43, ease: "power3.inOut" }, 3.40);
      // profondeur de champ : quand la lampe baisse, le premier plan recule (flou +4 px, atténué), la page reste nette
      ft(C, { d: 0, o: 0.92 }, { d: 4, o: 0.7, duration: 0.6, ease: "power2.inOut" }, 1.30);

      /* ---- scène 1 : dimanche soir ---- */
      // 0.00 → 0.15 la page « Mercredi » finit de se retourner (-70 → -100deg), puis disparaît derrière son axe
      ft($("flip"), { rotationX: -70 }, { rotationX: -100, duration: 0.15, ease: "power1.out" }, 0);
      ft($("flip-in"), { filter: "brightness(0.72)" }, { filter: "brightness(0.5)", duration: 0.15, ease: "none" }, 0);
      ft($("flip"), { opacity: 1 }, { opacity: 0, duration: 0.001, ease: "none" }, 0.16);
      // 0.63 le post-it tombe sur la page depuis le haut : y -200 → 0, rotation -14 → 4 (0.35 s expo.out), case vide
      ft($("postit"), { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 0.63);
      ft($("postit"), { y: -200, rotation: -14, scale: 1.08, filter: "blur(5px)", transformOrigin: "50% 50%" },
        { y: 0, rotation: 4, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, 0.63);
      // son ombre : molle et décalée tant qu'il tombe, elle se resserre sous lui quand il touche
      ft($("pshadow"), { opacity: 0, x: 50, y: -60, rotation: -14, scale: 1.12, filter: "blur(34px)" },
        { opacity: 0.30, x: 6, y: 16, rotation: 4, scale: 1, filter: "blur(10px)", duration: 0.35, ease: "expo.out" }, 0.63);
      // 1.30 la lampe baisse : halo froid 100 → 70 %
      ft($("lamp"), { opacity: 1 }, { opacity: 0.7, duration: 0.6, ease: "power2.inOut" }, 1.30);
      // 1.80 l'heure « 23:12 » apparaît dans l'en-tête de la page
      ft($("clock"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 1.80);

      /* ---- scène 2 : rien n'a bougé ---- */
      // 2.80 une poussière traverse la page vide (le seul mouvement), puis s'éteint hors de la lumière
      ft($("dust"), { opacity: 0 }, { opacity: 0.85, duration: 0.2, ease: "power2.out" }, 2.80);
      ft($("dust"), { x: 0 }, { x: 430, duration: 0.85, ease: "none" }, 2.80);
      ft($("dust"), { y: 0 }, { y: -70, duration: 0.85, ease: "sine.inOut" }, 2.80);
      ft($("dust"), { opacity: 0.85 }, { opacity: 0, duration: 0.2, ease: "power2.in" }, 3.45);
      // 3.20 le téléphone glisse depuis le bas sur la page (0.5 s power3.out), écran noir
      ft($("phone"), { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, 3.20);
      ft($("phone"), { y: 1100 }, { y: 0, duration: 0.5, ease: "power3.out" }, 3.20);

      /* ---- la phrase de la voix : mot par mot, chaque mot 1 image avant son repère ---- */
      Array.prototype.forEach.call(document.querySelectorAll("#f03-subs .pm-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - 1 / 30;
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, cue);
      });
      // 2.05 « Dimanche soir… » s'en va avant la phrase suivante
      ft($("sub1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.05);
      // 2.29 la boîte rouge se trace sous « rien » (de la gauche, 0.16 s)
      ft($("box"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 2.29);
      // 3.10 le sous-titre s'en va
      ft($("sub2"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 3.10);

      // longueur exacte du plan
      tl.set({}, {}, DUR);
      // première image = handoff_in, avant tout seek
      render();
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
