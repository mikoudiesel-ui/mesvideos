  <script>
    (function () {
      var FID = "04-alarme", DUR = 2.3;
      function $(id) { return document.getElementById("f04-" + id); }
      var camEl = $("cam"), focusEl = $("focus");

      /* ---- la caméra : x, y = translation de #cam, s = échelle (origine 540 860), b = flou de bougé ---- */
      var C = { x: 0, y: 120, s: 1.10, b: 6 };
      function render() {
        camEl.style.transform = "translate(" + C.x.toFixed(2) + "px," + C.y.toFixed(2) + "px) scale(" + C.s.toFixed(5) + ")";
        focusEl.style.filter = C.b > 0.01 ? "blur(" + C.b.toFixed(2) + "px)" : "none";
      }

      var tl = gsap.timeline({ paused: true, onUpdate: render });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }
      // première moitié d'un power3.inOut ramenée à [0, 1] : le mouvement est « en cours » (à pleine vitesse) à la couture
      var pio = gsap.parseEase("power3.inOut");
      function halfInOut(p) { return pio(p * 0.5) * 2; }

      /* ---- piste caméra ---- */
      // 0.00 → 0.30 atterrissage sur cam-phone (le téléphone entier, interface au-dessus de la coupure), flou 6 → 0
      ft(C, { x: 0, y: 120, s: 1.10, b: 6 }, { x: 0, y: -400, s: 1.10, b: 0, duration: 0.30, ease: "power3.out" }, 0);
      // 0.30 → 2.00 dérive qui ne s'arrête pas : échelle 1.10 → 1.12
      ft(C, { s: 1.10 }, { s: 1.12, duration: 1.70, ease: "none" }, 0.30);
      // 2.00 → 2.30 recul + panoramique à droite, en cours à la couture : cam(220, 0, 1.15), flou 8 px
      ft(C, { x: 0, y: -400, s: 1.12, b: 0 }, { x: 220, y: 0, s: 1.15, b: 8, duration: 0.30, ease: halfInOut }, 2.00);

      /* ---- 0.20 l'écran s'allume : écran verrouillé, « lundi 10 novembre », « 7:00 » ---- */
      ft($("screen"), { opacity: 0 }, { opacity: 1, duration: 0.10, ease: "power2.out" }, 0.20);
      ft($("spill"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 0.20);
      // 0.25 la carte « Alarme » tombe trop grande et floue (1.18 → 1, flou 5 → 0, 0.35 s)
      ft($("alarm"), { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 0.25);
      ft($("alarm"), { scale: 1.18, filter: "blur(5px)" }, { scale: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, 0.25);

      /* ---- 0.40 le téléphone vibre : x ±6 px, 6 pas ---- */
      var vib = [6, -6, 6, -6, 5, 0], vx = 0;
      vib.forEach(function (v, i) {
        ft($("phone"), { x: vx }, { x: v, duration: 0.09, ease: "sine.inOut" }, 0.40 + i * 0.09);
        vx = v;
      });

      /* ---- 0.80 les pastilles « Répéter » et « Arrêter » ---- */
      ft([$("p1"), $("p2")], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.18, ease: "power3.out", stagger: 0.04 }, 0.80);

      /* ---- le pouce : un seul geste depuis le bas, appui sur « Répéter » à 0.95 ---- */
      ft($("thumb"), { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 0.66);
      ft($("thumb"), { x: 150, y: 980, rotation: -24 }, { x: 0, y: 0, rotation: -14, duration: 0.27, ease: "power3.out" }, 0.66);
      // appui : le pouce s'écrase plus que la pastille, ensemble, puis relâchent
      ft($("thumb"), { scale: 1 }, { scale: 0.88, duration: 0.07, ease: "power2.in" }, 0.95);
      ft($("thumb"), { scale: 0.88 }, { scale: 1, duration: 0.10, ease: "power2.out" }, 1.02);
      ft($("p1"), { scale: 1, backgroundColor: "rgba(255,255,255,0.2)" }, { scale: 0.95, backgroundColor: "rgba(255,255,255,0.42)", duration: 0.07, ease: "power2.in" }, 0.95);
      ft($("p1"), { scale: 0.95 }, { scale: 1, duration: 0.10, ease: "power2.out" }, 1.02);
      // onde depuis le point d'appui
      tl.set($("ripple"), { opacity: 1 }, 0.96);
      ft($("ripple"), { scale: 0, opacity: 1 }, { scale: 4, opacity: 0, duration: 0.50, ease: "power2.out" }, 0.96);
      // le pouce repart (sortie plus rapide que l'entrée), hors champ avant 1.30
      ft($("thumb"), { x: 0, y: 0, rotation: -14 }, { x: 120, y: 900, rotation: -22, duration: 0.22, ease: "power3.in" }, 1.08);

      /* ---- 1.30 l'écran redevient noir ---- */
      ft([$("screen"), $("alarm")], { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "power2.in" }, 1.30);
      ft($("spill"), { opacity: 1 }, { opacity: 0, duration: 0.10, ease: "power2.in" }, 1.30);

      /* ---- 1.40 le petit reflet à cornes sourit dans le verre noir ---- */
      ft($("glass"), { opacity: 0 }, { opacity: 1, duration: 0.30, ease: "power2.out" }, 1.40);
      ft($("refl"), { opacity: 0, scale: 0.94 }, { opacity: 0.5, scale: 1, duration: 0.30, ease: "power3.out" }, 1.40);
      // 1.90 il s'efface lentement : encore faible à la couture (il devient l'ombre de la séquence 05)
      ft($("refl"), { opacity: 0.5 }, { opacity: 0.14, duration: 0.40, ease: "power1.in" }, 1.90);
      ft($("glass"), { opacity: 1 }, { opacity: 0.4, duration: 0.40, ease: "power1.in" }, 1.90);

      // longueur exacte du plan
      tl.set({}, {}, DUR);
      // première image = handoff_in, avant tout seek
      render();
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</body></html>
