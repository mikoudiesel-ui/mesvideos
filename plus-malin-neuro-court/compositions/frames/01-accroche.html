  <script>
    (function () {
      var FID = "01-accroche", DUR = 2.52;
      function $(id) { return document.getElementById("f01-" + id); }
      var camEl = $("cam"), fgEl = $("fg"), focusEl = $("focus"), pencilIn = $("pencil-in");

      var tl = gsap.timeline({ paused: true });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      /* ---- la fêlure : une ligne brisée du coin haut-gauche au coin bas-droit du post-it ---- */
      var P = [[0,0],[96,58],[150,128],[238,166],[300,248],[392,284],[452,362],[548,398],[600,470],[672,528]];
      var pts = P.map(function (p) { return p[0] + "," + p[1]; }).join(" ");
      ["crackA", "crackB", "gapline"].forEach(function (k) { $(k).setAttribute("points", pts); });
      // découpes statiques des deux moitiés ; la moitié haute déborde de 2 px sur la fêlure (aucune couture visible avant la déchirure)
      function poly(list) { return "polygon(" + list.map(function (p) { return p[0] + "px " + p[1] + "px"; }).join(",") + ")"; }
      var A = P.map(function (p) { return [p[0] - 2, p[1] + 2]; });
      A.unshift([-4, -4]); A.push([676, 532], [676, -4]);
      var B = P.slice(); B.unshift([0, 0]); B.push([672, 528], [-4, 532], [-4, -4]);
      $("halfA").style.clipPath = poly(A);
      $("halfB").style.clipPath = poly(B);

      /* ---- la caméra : tweens directs (aucun callback) ----
         y : translation (négatif = la caméra descend), s : échelle, b : flou de bougé (px).
         Le premier plan (crayon) bouge 1,5 fois plus que le post-it ; son flou vaut 6 + 1,5 b. */
      gsap.set(camEl, { transformOrigin: "540px 860px" });
      gsap.set(fgEl, { transformOrigin: "540px 860px" });
      function camSeg(from, to, dur, ease, pos) {
        var cf = {}, ct = {}, gf = {}, gt = {};
        if ("y" in from) { cf.y = from.y; ct.y = to.y; gf.y = from.y * 1.5; gt.y = to.y * 1.5; }
        if ("s" in from) { cf.scale = from.s; ct.scale = to.s; gf.scale = 1 + (from.s - 1) * 1.5; gt.scale = 1 + (to.s - 1) * 1.5; }
        ct.duration = gt.duration = dur; ct.ease = gt.ease = ease;
        ft(camEl, cf, ct, pos);
        ft(fgEl, gf, gt, pos);
        if ("b" in from) {
          ft(focusEl, { filter: "blur(" + from.b + "px)" }, { filter: "blur(" + to.b + "px)", duration: dur, ease: ease }, pos);
          ft(pencilIn, { filter: "blur(" + (6 + from.b * 1.5) + "px)" }, { filter: "blur(" + (6 + to.b * 1.5) + "px)", duration: dur, ease: ease }, pos);
        }
      }

      /* ---- piste caméra ---- */
      // 0.00 → 2.35 dérive linéaire 1.00 → 1.056 (elle ne s'arrête jamais)
      camSeg({ y: 0, s: 1.0 }, { y: 0, s: 1.056 }, 2.35, "none", 0);
      // 2.35 → 2.52 whip vers le bas (power3.in) : y 0 → -200, flou 0 → 8 px (en cours à la coupe)
      camSeg({ y: 0, s: 1.056, b: 0 }, { y: -200, s: 1.06, b: 8 }, 0.17, "power3.in", 2.35);

      /* ---- 0.10 le post-it « Demain » claque depuis la caméra ---- */
      // poussée à travers la caméra (motion-blur-streak, variante « B B ») : échelle 3 → 1, flou 20 → 0, rotation -12 → -4, expo.out 0.25 s
      ft($("postit"), { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 0.10);
      ft($("postit"), { scale: 3, rotation: -12, transformOrigin: "50% 50%" },
        { scale: 1, rotation: -4, duration: 0.25, ease: "expo.out" }, 0.10);
      ft($("postit"), { filter: "blur(20px)" }, { filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, 0.10);
      // son ombre : large et molle pendant le vol, elle colle à l'impact
      ft($("pshadow"), { opacity: 0, scale: 2.2, rotation: -10, x: 0, y: 160, filter: "blur(60px)" },
        { opacity: 0.5, scale: 1.08, rotation: -4, x: 18, y: 60, filter: "blur(30px)", duration: 0.25, ease: "expo.out" }, 0.10);
      // l'impact : tout le cadre tremble une fois (x ±10 px, 3 pas, 0.15 s)
      ft($("shake"), { x: 0 }, { x: 10, duration: 0.04, ease: "power2.out" }, 0.17);
      ft($("shake"), { x: 10 }, { x: -10, duration: 0.05, ease: "power2.inOut" }, 0.21);
      ft($("shake"), { x: -10 }, { x: 0, duration: 0.06, ease: "power3.out" }, 0.26);
      // la lampe vacille sous le choc
      ft($("lamp"), { opacity: 1 }, { opacity: 0.55, duration: 0.03, ease: "none" }, 0.17);
      ft($("lamp"), { opacity: 0.55 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, 0.20);
      // le crayon tressaute (il roule de 14 px)
      ft($("pencil-in"), { y: 0 }, { y: 14, duration: 0.35, ease: "power3.out" }, 0.17);
      ft($("facets"), { y: 0 }, { y: -9, duration: 0.35, ease: "power3.out" }, 0.17);

      /* ---- 0.45 l'ombre se resserre (pop) ---- */
      ft($("pshadow"), { opacity: 0.5, scale: 1.08, x: 18, y: 60, filter: "blur(30px)" },
        { opacity: 0.34, scale: 1.0, x: 6, y: 18, filter: "blur(12px)", duration: 0.25, ease: "power3.out" }, 0.45);

      /* ---- 0.71 « Demain » pulse rouge une fois (0.2 s) ---- */
      ["redA", "redB"].forEach(function (k) {
        ft($(k), { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "power3.out" }, 0.70);
        ft($(k), { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.in" }, 0.90);
      });
      ft(".f01-word", { scale: 1 }, { scale: 1.06, duration: 0.08, ease: "power3.out" }, 0.70);
      ft(".f01-word", { scale: 1.06 }, { scale: 1, duration: 0.2, ease: "power2.out" }, 0.80);

      /* ---- 1.28 la fêlure rouge se trace du haut-gauche au bas-droit (0.3 s) ---- */
      ft([$("crackA"), $("crackB")], { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.30, ease: "power2.inOut" }, 1.28);

      /* ---- 2.25 le post-it se déchire le long de la fêlure : les moitiés s'écartent de 10 px ---- */
      // normale à la diagonale (672, 528) : (0.618, -0.786)
      ft($("halfA"), { x: 0, y: 0, rotation: 0 }, { x: 3.1, y: -3.9, rotation: 0.8, transformOrigin: "672px 0px", duration: 0.22, ease: "power3.out" }, 2.25);
      ft($("halfB"), { x: 0, y: 0, rotation: 0 }, { x: -3.1, y: 3.9, rotation: -0.8, transformOrigin: "0px 528px", duration: 0.22, ease: "power3.out" }, 2.25);
      ft($("gap"), { opacity: 0 }, { opacity: 1, duration: 0.10, ease: "power2.out" }, 2.25);

      /* ---- la phrase de la voix : mot par mot, chaque mot 1 image avant son repère ---- */
      Array.prototype.forEach.call(document.querySelectorAll("#f01-sub .pm-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - 1 / 30;
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, cue);
      });
      // 1.87 la boîte rouge se trace sous « rêve. » (de la gauche, 0.16 s)
      ft($("box"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 1.87);
      // 2.35 le sous-titre s'en va (flou 6, 0.10 s : parti 2 images avant la coupe)
      ft($("sub"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.10, ease: "power2.in" }, 2.35);

      // longueur exacte du plan
      tl.set({}, {}, DUR);
      tl.seek(0);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
