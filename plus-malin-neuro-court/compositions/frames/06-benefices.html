  <script src="assets/js/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "06-benefices", DUR = 5.50, F = 1 / 30;
      function $(id) { return document.getElementById("f06-" + id); }

      var tl = gsap.timeline({ paused: true });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      /* ---- piste caméra : dérive linéaire 1.00 → 1.03, jamais arrêtée ---- */
      ft($("cam"), { x: 0, y: 0, scale: 1.0 }, { x: 0, y: 0, scale: 1.03, duration: DUR, ease: "none" }, 0);

      /* ---- la couverture : handoff_in en (260, 360), -3deg, nette ---- */
      ft($("cover"), { x: 0, y: 0, scale: 1, rotation: -3, transformOrigin: "50% 50%" },
        { x: 0, y: 0, scale: 1, rotation: -3, duration: 0.10, ease: "none" }, 0);
      // 0.10 elle monte et réduit : à 5.50, caméra à 1.03, elle se lit à l'échelle .62, centrée, haut à y 120
      // (centre monde 382.33 = 860 − 477.67 ; échelle monde .62 / 1.03)
      ft($("cover"), { y: 0, scale: 1 }, { y: -377.67, scale: 0.62 / 1.03, duration: 0.50, ease: "power3.inOut" }, 0.10);

      /* ---- les bénéfices tombent (waterfall : opacité binaire, y −40 → 0, flou 8 → 0, 0.3 s expo.out) ---- */
      [["l1", "t1", 0.57, 1.18], ["l2", "t2", 2.00, 2.12], ["l3", "t3", 3.44, 4.56]].forEach(function (k) {
        tl.set($(k[0]), { opacity: 1 }, k[2]);
        ft($(k[0]), { y: -40, filter: "blur(8px)" }, { y: 0, filter: "blur(0px)", duration: 0.30, ease: "expo.out" }, k[2]);
        // la coche verte claque (scale 0 → 1, 0.2 s) sur son mot
        ft($(k[1]), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.20, ease: "expo.out" }, k[3] - F);
      });

      /* ---- 4.80 les trois coches pulsent en vert ensemble, une fois ---- */
      ["t1", "t2", "t3"].forEach(function (id) {
        ft($(id), { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.16, duration: 0.12, ease: "power2.out" }, 4.80);
        ft($(id), { scale: 1.16, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.22, ease: "power2.inOut" }, 4.92);
      });
      ["r1", "r2", "r3"].forEach(function (id) {
        ft($(id), { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.8, duration: 0.45, ease: "power2.out" }, 4.80);
      });

      /* ---- les phrases de la voix : mot par mot, chaque mot 1 image avant son repère ---- */
      Array.prototype.forEach.call(document.querySelectorAll("#f06-subs .pm-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - F;
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, cue);
      });
      // les boîtes vertes se tracent 0 à 2 images avant leur mot
      ft($("boxA"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 1.16);
      ft($("boxB"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 2.10);
      ft($("boxC"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 4.54);
      // chaque morceau remplace le précédent (sorties plus rapides que les entrées)
      ft($("subA"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.12, ease: "power2.in" }, 1.84);
      ft($("subB"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.12, ease: "power2.in" }, 3.04);
      // 5.30 le sous-titre s'en va (fini à 5.42, avant les 2 images de la couture)
      ft($("subC"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.12, ease: "power2.in" }, 5.30);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
