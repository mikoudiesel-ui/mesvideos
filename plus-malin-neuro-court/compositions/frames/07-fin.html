      ft($("cta"), { y: 200, filter: "blur(8px)" }, { y: 0, filter: "blur(0px)", duration: 0.40, ease: "expo.out" }, 0.50);

      Array.prototype.forEach.call(document.querySelectorAll("#f07-subs .pm-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - 1 / 30;
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, cue);
      });
      // 0.95 la boîte verte se trace sous « Je le veux » (de la gauche, 0.16 s), 1 image avant « Je »
      ft($("box"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 0.95);
      // 2.12 changement de phrase : la première s'en va (flou 6, 0.12 s)
      ft($("sub1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.12, ease: "power2.in" }, 2.12);
      // 3.62 le trait doré sous « maintenant. » (de la gauche, 0.35 s)
      ft($("stroke"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 3.62);

      /* ---- 1.20 le curseur arrive de la droite en un seul geste courbe (0.45 s power3.out) ---- */
      ft($("cursor"), { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, 1.20);
      ft($("cursor"), { x: 560 }, { x: 0, duration: 0.45, ease: "power3.out" }, 1.20);
      ft($("cursor"), { y: 220 }, { y: 0, duration: 0.45, ease: "power1.out" }, 1.20);

      /* ---- 1.80 le clic : curseur .85 et bouton .96 ensemble, puis retour ; anneaux blancs ---- */
      ft($("cursor"), { scale: 1 }, { scale: 0.85, duration: 0.06, ease: "power2.in" }, 1.80);
      ft($("cursor"), { scale: 0.85 }, { scale: 1, duration: 0.10, ease: "power2.out" }, 1.86);
      ft($("cta"), { scale: 1 }, { scale: 0.96, duration: 0.06, ease: "power2.in" }, 1.80);
      ft($("cta"), { scale: 0.96 }, { scale: 1, duration: 0.10, ease: "power2.out" }, 1.86);
      ft($("rip1"), { scale: 0, opacity: 1 }, { scale: 4, opacity: 0, duration: 0.70, ease: "power2.out" }, 1.82);
      ft($("rip2"), { scale: 0, opacity: 0.8 }, { scale: 5, opacity: 0, duration: 0.80, ease: "power2.out" }, 1.91);
      // le bouton s'illumine
      ft($("glow"), { opacity: 0 }, { opacity: 0.8, duration: 0.20, ease: "power3.out" }, 1.90);
      ft($("glow"), { opacity: 0.8 }, { opacity: 0.45, duration: 0.60, ease: "power2.inOut" }, 2.10);
      ft($("cta"), { filter: "brightness(1)" }, { filter: "brightness(1.12)", duration: 0.20, ease: "power3.out" }, 1.90);
      ft($("cta"), { filter: "brightness(1.12)" }, { filter: "brightness(1.04)", duration: 0.60, ease: "power2.inOut" }, 2.10);

      /* ---- 2.20 le post-it « Commencer » vole et se colle sur le coin haut droit de la couverture ---- */
      ft($("postit"), { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 2.20);
      ft($("postit"), { x: 520, y: -460, scale: 0.6 * 1.35, rotation: 24, filter: "blur(8px)" },
        { x: 0, y: 0, scale: 0.6, rotation: 6, filter: "blur(0px)", duration: 0.40, ease: "expo.out" }, 2.20);

      /* ---- 2.60 la case se coche : ☐ → ☑ ---- */
      ft($("tick"), { strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 0.30, ease: "power2.out" }, 2.60);
      ft($("check"), { scale: 1 }, { scale: 1.15, duration: 0.10, ease: "power3.out" }, 2.60);
      ft($("check"), { scale: 1.15 }, { scale: 1, duration: 0.20, ease: "power2.inOut" }, 2.70);

      /* ---- 4.30 la flèche ↓ verte se dessine de haut en bas (fenêtre qui descend, contenu fixe), 0.35 s ---- */
      gsap.set($("arrow-win"), { y: -128 });
      gsap.set($("arrow-in"), { y: 128 });
      ft($("arrow-win"), { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, 4.30);
      ft($("arrow-win"), { y: -128 }, { y: 0, duration: 0.35, ease: "power2.out" }, 4.30);
      ft($("arrow-in"), { y: 128 }, { y: 0, duration: 0.35, ease: "power2.out" }, 4.30);

      /* ---- 4.50 → 7.12 la fin vivante (tweens finis) ---- */
      // le halo doré respire une fois
      ft($("halo2"), { opacity: 0 }, { opacity: 0.4, duration: 1.10, ease: "sine.inOut" }, 4.50);
      ft($("halo2"), { opacity: 0.4 }, { opacity: 0, duration: 1.10, ease: "sine.inOut" }, 5.60);
      // la lueur du bouton remonte doucement avec le halo
      ft($("glow"), { opacity: 0.45 }, { opacity: 0.7, duration: 1.10, ease: "sine.inOut" }, 4.50);
      ft($("glow"), { opacity: 0.7 }, { opacity: 0.5, duration: 1.10, ease: "sine.inOut" }, 5.60);
      // la flèche insiste vers le bas, deux fois
      ft($("arrow-in"), { y: 0 }, { y: 10, duration: 0.30, ease: "power2.inOut" }, 5.00);
      ft($("arrow-in"), { y: 10 }, { y: 0, duration: 0.30, ease: "power2.inOut" }, 5.30);
      ft($("arrow-in"), { y: 0 }, { y: 10, duration: 0.30, ease: "power2.inOut" }, 6.00);
      ft($("arrow-in"), { y: 10 }, { y: 0, duration: 0.30, ease: "power2.inOut" }, 6.30);
      // poussières : elles apparaissent dans la lumière et montent lentement (valeurs fixes, aucun hasard)
      var dust = [
        [0.55, -60, 12], [0.4, -50, -10], [0.6, -66, 8], [0.45, -52, -12], [0.5, -44, 10], [0.55, -62, -8],
        [0.35, -40, 8], [0.45, -56, -10], [0.3, -36, 6], [0.35, -46, -6], [0.4, -54, 8], [0.35, -40, -8]
      ];
      dust.forEach(function (d, i) {
        var el = $("d" + (i + 1)), t0 = 4.50 + (i % 6) * 0.10;
        ft(el, { opacity: 0 }, { opacity: d[0], duration: 0.50, ease: "power2.out" }, t0);
        ft(el, { x: 0, y: 0 }, { x: d[2], y: d[1], duration: DUR - t0, ease: "none" }, t0);
      });

      // longueur exacte du plan
      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
