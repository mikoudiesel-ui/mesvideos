    (function () {

      var tl = gsap.timeline({ paused: true });

      /* ---- la fêlure : une ligne brisée du coin haut-gauche au coin bas-droit du post-it (378 × 297) ---- */

      /* ---- la caméra : tweens directs (aucun callback), origine sur le visage d'Awa (photo 380, 380 → 436, 436) ---- */
      gsap.set(camEl, { transformOrigin: "436px 436px" });
      // 0.00 → 0.30 punch-in vers le visage : 1.10 → 1.22 (power3.out)
      ft(camEl, { x: 0, y: 0, scale: 1.10 }, { x: 0, y: 0, scale: 1.22, duration: 0.30, ease: "power3.out" }, 0);
      // 0.30 → 2.38 dérive lente 1.22 → 1.26 (elle ne s'arrête jamais)
      ft(camEl, { scale: 1.22 }, { scale: 1.26, duration: 2.08, ease: "none" }, 0.30);
      // 2.38 → 2.52 whip vers le bas : y 0 → -200 (power3.in, en cours à la coupe), flou 0 → 8 px
      ft(camEl, { y: 0, scale: 1.26 }, { y: -200, scale: 1.262, duration: 0.14, ease: "power3.in" }, 2.38);
      ft(focusEl, { filter: "blur(0px)" }, { filter: "blur(8px)", duration: 0.11, ease: "power2.in" }, 2.38);

      /* ---- 0.40 le post-it « Demain » claque sur le mur (motion-blur-streak, variante « B B ») ---- */
      ft($("postit"), { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 0.40);
      ft($("postit"), { scale: 2.6, rotation: 14, transformOrigin: "50% 50%" },
        { scale: 1, rotation: 6, duration: 0.25, ease: "expo.out" }, 0.40);
      ft($("postit"), { filter: "blur(18px)" }, { filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, 0.40);
      // son ombre sur le mur : large et molle pendant le vol, elle colle à l'impact
      ft($("pshadow"), { opacity: 0, scale: 2.0, rotation: 12, x: 0, y: 90, filter: "blur(40px)" },
        { opacity: 0.45, scale: 1.06, rotation: 6, x: 14, y: 30, filter: "blur(22px)", duration: 0.25, ease: "expo.out" }, 0.40);
      // l'impact : tout le cadre tremble une fois (x ±10 px, 3 pas, 0.15 s)
      ft($("shake"), { x: 0 }, { x: 10, duration: 0.04, ease: "power2.out" }, 0.47);
      ft($("shake"), { x: 10 }, { x: -10, duration: 0.05, ease: "power2.inOut" }, 0.51);
      ft($("shake"), { x: -10 }, { x: 0, duration: 0.06, ease: "power3.out" }, 0.56);

      /* ---- 0.65 l'ombre se resserre (pop) ---- */
      ft($("pshadow"), { opacity: 0.45, scale: 1.06, x: 14, y: 30, filter: "blur(22px)" },
        { opacity: 0.32, scale: 1.0, x: 8, y: 14, filter: "blur(10px)", duration: 0.22, ease: "power3.out" }, 0.65);

      /* ---- 0.71 « Demain » pulse rouge une fois ---- */
      ft($("red"), { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "power3.out" }, 0.70);
      ft($("red"), { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.in" }, 0.90);
      ft(".f01-word", { scale: 1 }, { scale: 1.08, duration: 0.08, ease: "power3.out" }, 0.70);
      ft(".f01-word", { scale: 1.08 }, { scale: 1, duration: 0.2, ease: "power2.out" }, 0.80);

      /* ---- 1.28 la fêlure rouge se trace en travers du post-it (0.3 s) ---- */
      ft($("crack"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.30, ease: "power2.inOut" }, 1.28);

      /* ---- la phrase de la voix : mot par mot, chaque mot 1 image avant son repère ---- */
      Array.prototype.forEach.call(document.querySelectorAll("#f01-sub .pm-w"), function (w) {

      });
