      /* ---- l'écran de la tablette, mesuré sur la photo (px photo, élargi de 2 px pour ne jamais laisser voir l'autre ebook) ---- */
      var Q = [[495, 582], [834, 585], [827.5, 1121], [482, 1104]]; // TL, TR, BR, BL
      function homography(w, h, q) {
        var x0 = q[0][0], y0 = q[0][1], x1 = q[1][0], y1 = q[1][1], x2 = q[2][0], y2 = q[2][1], x3 = q[3][0], y3 = q[3][1];
        var dx1 = x1 - x2, dx2 = x3 - x2, dx3 = x0 - x1 + x2 - x3, dy1 = y1 - y2, dy2 = y3 - y2, dy3 = y0 - y1 + y2 - y3;
        var den = dx1 * dy2 - dx2 * dy1;
        var g = (dx3 * dy2 - dx2 * dy3) / den, hh = (dx1 * dy3 - dx3 * dy1) / den;
        var a = x1 - x0 + g * x1, b = x3 - x0 + hh * x3, d = y1 - y0 + g * y1, e = y3 - y0 + hh * y3;
        var m = [a / w, d / w, 0, g / w, b / h, e / h, 0, hh / h, 0, 0, 1, 0, x0, y0, 0, 1];
        return "matrix3d(" + m.map(function (v) { return +v.toFixed(8); }).join(",") + ")";
      }
      $("tcover").style.transform = homography(560, 800, Q);

      /* ---- les bords déchirés (copiés de la révélation V2) : une seule ligne en dents de scie, clip-paths statiques ---- */
      var JAG = [0, 14, -10, 6, -16, 9, -4, 17, -12, 3, -8, 15, -14, 7, -2, 12, -17, 5, -9, 16, -6, 10, -13, 2, -11, 18, -5, 8, -15, 11, -3, 13, 0];
      function edge(base) { return JAG.map(function (d, i) { return (base + d) + "px " + (i * 60) + "px"; }); }
      $("faceL").style.clipPath = "polygon(0px 0px, " + edge(1240).join(", ") + ", 0px 1920px)";
      $("faceR").style.clipPath = "polygon(" + edge(40).join(", ") + ", 1280px 1920px, 1280px 0px)";
      $("rimL").style.clipPath = "polygon(0px 0px, " + edge(1237).join(", ") + ", 0px 1920px)";
      $("rimR").style.clipPath = "polygon(" + edge(43).join(", ") + ", 1280px 1920px, 1280px 0px)";

      /* ---- pose finale de la caméra : l'écran (px écran = px photo × 1.14833 − 0.3) tombe sur la couverture plate
              (560 × 800, centre 540, 760, -3deg). Origine de la caméra : 540, 860 (pm-cam). ---- */
      var K = 1.14833;
      var C = Q.map(function (p) { return [p[0] * K - 0.3, p[1] * K]; });
      var cx = (C[0][0] + C[1][0] + C[2][0] + C[3][0]) / 4, cy = (C[0][1] + C[1][1] + C[2][1] + C[3][1]) / 4;
      var area = 0.5 * Math.abs((C[2][0] - C[0][0]) * (C[3][1] - C[1][1]) - (C[3][0] - C[1][0]) * (C[2][1] - C[0][1]));
      var S = Math.sqrt(560 * 800 / area);
      var angTop = Math.atan2(C[1][1] - C[0][1], C[1][0] - C[0][0]), angBot = Math.atan2(C[2][1] - C[3][1], C[2][0] - C[3][0]);
      var angL = Math.atan2(C[0][0] - C[3][0], C[3][1] - C[0][1]), angR = Math.atan2(C[1][0] - C[2][0], C[2][1] - C[1][1]);
      var screenRot = (angTop + angBot + angL + angR) / 4 * 180 / Math.PI;
      var ROT = -3 - screenRot, r = ROT * Math.PI / 180;
      var vx = (cx - 540) * S, vy = (cy - 860) * S;
      var TX = 540 - 540 - (Math.cos(r) * vx - Math.sin(r) * vy), TY = 760 - 860 - (Math.sin(r) * vx + Math.cos(r) * vy);

      var tl = gsap.timeline({ paused: true });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      /* ---- piste caméra (#f05-cam, tweens directs) ---- */
      // 0.00 → 0.60 tenue à 1.15 sous le noir ; 0.60 → 1.10 poussée à travers la déchirure 1.15 → 1.00 (power3.out)
      ft(camEl, { x: 0, y: 0, rotation: 0, scale: 1.15 }, { x: 0, y: 0, rotation: 0, scale: 1.15, duration: 0.60, ease: "none" }, 0);
      ft(camEl, { scale: 1.15 }, { scale: 1.0, duration: 0.50, ease: "power3.out" }, 0.60);
      // 1.10 → 1.40 dérive lente
      ft(camEl, { scale: 1.0 }, { scale: 1.008, duration: 0.30, ease: "none" }, 1.10);
      // 1.40 → 3.30 poussée dans la tablette (power2.inOut) jusqu'à la pose de la couverture de 06
      ft(camEl, { x: 0, y: 0, rotation: 0, scale: 1.008 }, { x: TX, y: TY, rotation: ROT, scale: S, duration: 1.90, ease: "power2.inOut" }, 1.40);
      // profondeur de champ : Awa et le canapé se défocalisent pendant la poussée, la tablette reste nette
      ft($("dof"), { filter: "blur(0px) brightness(1)" }, { filter: "blur(7px) brightness(0.82)", duration: 1.40, ease: "power2.in" }, 1.90);

      /* ---- 0.00 les yeux rouges s'éteignent (0.2 s) ---- */
      ft([$("eye1"), $("eye2")], { opacity: 1 }, { opacity: 0, duration: 0.20, ease: "power2.in" }, 0);

      /* ---- 0.25 la fêlure d'or se trace en x 540 ---- */
      ft($("crack"), { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none" }, 0.25);
      ft($("crack"), { scaleY: 0 }, { scaleY: 1, duration: 0.30, ease: "power2.out" }, 0.25);
      ft($("crackhalo"), { opacity: 0, scaleY: 0, scaleX: 0.6 }, { opacity: 0.7, scaleY: 1, scaleX: 1, duration: 0.26, ease: "power2.out" }, 0.25);
      ft($("crackhalo"), { opacity: 0.7, scaleX: 1 }, { opacity: 1, scaleX: 1.5, duration: 0.09, ease: "power2.in" }, 0.51);

      /* ---- 0.60 le noir se déchire : les deux moitiés s'écartent (x ∓560, 0.5 s power3.out) sur la photo d'Awa ---- */
      ft($("world"), { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none" }, 0.60);
      gsap.set($("halfL"), { transformOrigin: "1240px 960px" });
      gsap.set($("halfR"), { transformOrigin: "40px 960px" });
      ft($("halfL"), { x: 0, rotation: 0 }, { x: -560, rotation: -7, duration: 0.50, ease: "power3.out" }, 0.60);
      ft($("halfR"), { x: 0, rotation: 0 }, { x: 560, rotation: 7, duration: 0.50, ease: "power3.out" }, 0.60);
      ft($("faceL"), { x: 0 }, { x: -19, duration: 0.25, ease: "power3.out" }, 0.60);
      ft($("faceR"), { x: 0 }, { x: 19, duration: 0.25, ease: "power3.out" }, 0.60);
      ft($("crack"), { scaleX: 1, opacity: 1 }, { scaleX: 4, opacity: 0, duration: 0.25, ease: "power2.out" }, 0.60);
      ft($("crackhalo"), { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.out" }, 0.60);
      // la lumière dorée inonde par la déchirure, puis se résorbe dans l'étalonnage chaud
      ft($("flood"), { opacity: 0, scaleX: 0.08, scaleY: 0.9 }, { opacity: 0.9, scaleX: 1.1, scaleY: 1.05, duration: 0.35, ease: "power3.out" }, 0.62);
      ft($("flood"), { opacity: 0.9 }, { opacity: 0, duration: 0.80, ease: "power2.out" }, 0.97);
      // la lueur dorée autour de la tablette
      ft($("glow"), { opacity: 0 }, { opacity: 1, duration: 0.50, ease: "power2.out" }, 0.75);
      // la mention « Image IA » arrive avec la photo
      ft($("tag"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, 0.62);

      /* ---- 1.40 les moitiés quittent le cadre (sortie plus rapide) ---- */
      ft($("halfL"), { x: -560, rotation: -7 }, { x: -860, rotation: -9, duration: 0.35, ease: "power3.in" }, 1.40);
      ft($("halfR"), { x: 560, rotation: 7 }, { x: 860, rotation: 9, duration: 0.35, ease: "power3.in" }, 1.40);

      /* ---- 2.80 un reflet doré balaie la couverture sur l'écran ---- */
      ft($("sheen"), { x: 0, rotation: 20 }, { x: 1150, rotation: 20, duration: 0.45, ease: "power2.inOut" }, 2.80);

      /* ---- 3.30 → 3.55 fondu enchaîné : l'écran de la tablette → la couverture plate sur le sol doré ---- */
      gsap.set($("cover"), { rotation: -3, transformOrigin: "50% 50%" });
      gsap.set($("fcam"), { x: 0, y: 0, scale: 1 });
      ft($("flat"), { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 3.30);
      ft($("world"), { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "power1.in" }, 3.30);
      ft($("tag"), { opacity: 1 }, { opacity: 0, duration: 0.20, ease: "power2.in" }, 3.33);

      /* ---- les phrases de la voix : mot par mot, chaque mot 1 image avant son repère ---- */
      Array.prototype.forEach.call(document.querySelectorAll("#f05-subs .pm-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - F;
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, cue);
      });
      // 1.17 la boîte verte se trace sous « démasque »
      ft($("box"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 1.17);
      // 1.90 changement de phrase
      ft($("subA"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 1.90);
      // 2.42 le trait de crête doré sous « malin »
      ft($("stroke"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 2.42);
      // 3.60 la phrase s'en va (finie à 3.74, plus de sous-titre à la couture)
      ft($("subB"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 3.60);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
