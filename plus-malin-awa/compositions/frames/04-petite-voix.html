    (function () {

      var tl = gsap.timeline({ paused: true });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      /* ---- la caméra : tweens directs (aucun callback) ----
         x : translation du monde (positif = le monde décalé à droite), s : échelle, b : flou de bougé (px).
         Les yeux suivent exactement le monde ; le premier plan (crayon) bouge 1,5 fois plus ; son flou vaut 6 + 1,5 b. */
      gsap.set([camEl, eyeCamEl, fgEl], { transformOrigin: "540px 860px" });
      function camSeg(from, to, dur, ease, pos) {
        var cf = {}, ct = {}, gf = {}, gt = {};
        if ("x" in from) { cf.x = from.x; ct.x = to.x; gf.x = from.x * 1.5; gt.x = to.x * 1.5; }
        if ("s" in from) { cf.scale = from.s; ct.scale = to.s; gf.scale = 1 + (from.s - 1) * 1.5; gt.scale = 1 + (to.s - 1) * 1.5; }
        ct.duration = gt.duration = dur; ct.ease = gt.ease = ease;
        ft([camEl, eyeCamEl], cf, ct, pos);
        ft(fgEl, gf, gt, pos);
        if ("b" in from) {
          ft(focusEl, { filter: "blur(" + from.b + "px)" }, { filter: "blur(" + to.b + "px)", duration: dur, ease: ease }, pos);
          ft(pencilIn, { filter: "blur(" + (6 + from.b * 1.5) + "px)" }, { filter: "blur(" + (6 + to.b * 1.5) + "px)", duration: dur, ease: ease }, pos);
        }
      }

      // 0.20 → 2.40 dérive lente (1.05 → 1.08)
      camSeg({ s: 1.05 }, { s: 1.08 }, 2.20, "none", 0.20);
      // 2.40 → 3.30 léger recul pour montrer l'ombre entière (1.08 → 1.03)
      camSeg({ s: 1.08 }, { s: 1.03 }, 0.90, "power2.inOut", 2.40);
      // 3.30 → 4.19 la dérive reprend, à peine (1.03 → 1.04)
      camSeg({ s: 1.03 }, { s: 1.04 }, 0.89, "none", 3.30);

      /* ---- 1.00 le post-it reçoit un liseré doré doux ---- */
      ft($("rim"), { opacity: 0 }, { opacity: 0.9, duration: 0.45, ease: "power2.out" }, 1.00);

      /* ---- 2.40 l'ombre à cornes se lève depuis le bas droit de la page ---- */

      ft($("shadow"), { y: 400, scale: 0.7, transformOrigin: "380px 900px" }, { y: 0, scale: 1, duration: 0.50, ease: "power3.out" }, 2.40);
      ft($("rim"), { opacity: 0.9 }, { opacity: 0.25, duration: 0.50, ease: "power2.out" }, 2.40);
      // profondeur de champ : le post-it recule, l'ombre prend le regard
      ft($("postit"), { "--dof": "0px", opacity: 1 }, { "--dof": "3px", opacity: 0.8, duration: 0.60, ease: "power2.inOut" }, 2.40);
      ft($("rim"), { "--dof": "0px" }, { "--dof": "3px", duration: 0.60, ease: "power2.inOut" }, 2.40);

      /* ---- 3.60 deux yeux rouges s'ouvrent ---- */
      ft([$("eye1"), $("eye2")], { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.12, ease: "power3.out" }, 3.60);

      /* ---- 3.90 la lampe s'éteint (0.2 s) : seule la paire d'yeux brille ---- */
      ft($("lamp"), { opacity: 0.7 }, { opacity: 0, duration: 0.20, ease: "power2.out" }, 3.90);
      ft($("dark"), { opacity: 0 }, { opacity: 0.94, duration: 0.20, ease: "power2.out" }, 3.90);

      /* ---- la phrase de la voix : mot par mot, chaque mot 1 image avant son repère ---- */
      Array.prototype.forEach.call(document.querySelectorAll("#f04-subs .pm-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - 1 / 30;
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, cue);
      });
